<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Interactive Calendar</title>
   <script src="https://cdn.tailwindcss.com"></script>
   <style>
       @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
       body {
           font-family: 'Inter', sans-serif;
           background-color: #f3f4f6;
       }


       /* Custom scrollbar for event lists */
       .event-list::-webkit-scrollbar {
           width: 4px;
       }
       .event-list::-webkit-scrollbar-track {
           background: transparent;
       }
       .event-list::-webkit-scrollbar-thumb {
           background-color: #cbd5e1;
           border-radius: 10px;
       }
      
       /* Fade in animation for modal */
       @keyframes fadeIn {
           from { opacity: 0; transform: scale(0.95); }
           to { opacity: 1; transform: scale(1); }
       }
       .modal-animate {
           animation: fadeIn 0.2s ease-out forwards;
       }
   </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">


   <div class="w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden">
      
       <!-- Header -->
       <div class="flex items-center justify-between px-6 py-4 bg-indigo-600 text-white border-b border-indigo-700">
           <h1 class="text-2xl font-bold tracking-wide">My Calendar</h1>
           <div class="flex items-center space-x-4">
               <button onclick="changeMonth(-1)" class="p-2 hover:bg-indigo-700 rounded-full transition duration-200 ease-in-out focus:outline-none">
                   <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
               </button>
               <h2 id="monthDisplay" class="text-xl font-semibold w-40 text-center">Month Year</h2>
               <button onclick="changeMonth(1)" class="p-2 hover:bg-indigo-700 rounded-full transition duration-200 ease-in-out focus:outline-none">
                   <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
               </button>
               <button onclick="goToToday()" class="ml-4 px-3 py-1 bg-indigo-500 hover:bg-indigo-400 text-sm font-medium rounded-lg transition duration-200">Today</button>
           </div>
       </div>


       <!-- Legend -->
       <div class="flex flex-wrap items-center justify-center gap-4 py-3 px-6 bg-gray-50 border-b border-gray-200 text-sm">
           <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-blue-400 mr-2"></span> Homework</div>
           <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-purple-400 mr-2"></span> Meeting</div>
           <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-red-400 mr-2"></span> Due Date</div>
           <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-emerald-400 mr-2"></span> Holiday</div>
           <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-amber-400 mr-2"></span> Birthday</div>
       </div>


       <!-- Calendar Grid -->
       <div class="p-6">
           <div class="grid grid-cols-7 gap-px mb-2 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">
               <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
           </div>
           <div id="calendar" class="grid grid-cols-7 gap-2">
               <!-- Days will be generated by JS -->
           </div>
       </div>
   </div>


   <!-- Add/Edit Event Modal -->
   <div id="eventModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm px-4">
       <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden modal-animate">
           <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
               <h3 class="text-lg font-semibold text-gray-800" id="modalTitle">Add Event</h3>
               <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                   <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
               </button>
           </div>
           <div class="p-6">
               <p id="selectedDateDisplay" class="text-sm text-indigo-600 font-medium mb-4"></p>
               <form id="eventForm" onsubmit="saveEvent(event)">
                   <div class="mb-4">
                       <label for="eventTitle" class="block text-sm font-medium text-gray-700 mb-1">Event Title</label>
                       <input type="text" id="eventTitle" required placeholder="E.g., Math Final, Dentist..."
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                   </div>
                   <div class="mb-6">
                       <label for="eventType" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                       <select id="eventType" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-white">
                           <option value="Homework">Homework</option>
                           <option value="Meeting">Meeting</option>
                           <option value="DueDate">Due Date</option>
                           <option value="Holiday">Holiday</option>
                           <option value="Birthday">Birthday</option>
                       </select>
                   </div>
                   <div class="flex justify-end space-x-3">
                       <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition">Cancel</button>
                       <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition">Save Event</button>
                   </div>
               </form>
           </div>
       </div>
   </div>


   <!-- Message Toast (Instead of Alert) -->
   <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 ease-in-out bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center pointer-events-none">
       <span id="toastMessage">Action completed!</span>
   </div>


   <script>
       // State
       let nav = 0; // Month offset
       let clickedDateStr = null; // Stored as 'YYYY-MM-DD'
       let events = localStorage.getItem('calendarEvents') ? JSON.parse(localStorage.getItem('calendarEvents')) : {};


       // Constants
       const calendar = document.getElementById('calendar');
       const monthDisplay = document.getElementById('monthDisplay');
       const eventModal = document.getElementById('eventModal');
       const eventForm = document.getElementById('eventForm');
       const selectedDateDisplay = document.getElementById('selectedDateDisplay');
      
       const weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      
       // Colors mapping for tailwind classes
       const eventStyles = {
           'Homework': 'bg-blue-100 text-blue-800 border-blue-200 hover:bg-blue-200',
           'Meeting': 'bg-purple-100 text-purple-800 border-purple-200 hover:bg-purple-200',
           'DueDate': 'bg-red-100 text-red-800 border-red-200 hover:bg-red-200',
           'Holiday': 'bg-emerald-100 text-emerald-800 border-emerald-200 hover:bg-emerald-200',
           'Birthday': 'bg-amber-100 text-amber-800 border-amber-200 hover:bg-amber-200'
       };


       function showToast(message) {
           const toast = document.getElementById('toast');
           document.getElementById('toastMessage').innerText = message;
           toast.classList.remove('translate-y-20', 'opacity-0');
           setTimeout(() => {
               toast.classList.add('translate-y-20', 'opacity-0');
           }, 3000);
       }


       function getFormatDateString(year, month, day) {
           // Month is 0-indexed, so we add 1
           const m = (month + 1).toString().padStart(2, '0');
           const d = day.toString().padStart(2, '0');
           return `${year}-${m}-${d}`;
       }


       function load() {
           const dt = new Date();
          
           // Apply navigation offset
           if (nav !== 0) {
               dt.setMonth(new Date().getMonth() + nav);
           }


           const day = dt.getDate();
           const month = dt.getMonth();
           const year = dt.getFullYear();


           const firstDayOfMonth = new Date(year, month, 1);
           const daysInMonth = new Date(year, month + 1, 0).getDate();
           const dateString = firstDayOfMonth.toLocaleDateString('en-us', {
               weekday: 'long',
               year: 'numeric',
               month: 'numeric',
               day: 'numeric',
           });


           // Calculate padding days
           const paddingDays = weekdays.indexOf(dateString.split(', ')[0]);
          
           // Set Header text
           monthDisplay.innerText = `${dt.toLocaleDateString('en-us', { month: 'long' })} ${year}`;


           // Clear previous render
           calendar.innerHTML = '';


           // Generate Calendar grid
           for(let i = 1; i <= paddingDays + daysInMonth; i++) {
               const daySquare = document.createElement('div');
               daySquare.classList.add('min-h-[100px]', 'bg-white', 'border', 'border-gray-100', 'rounded-lg', 'p-2', 'flex', 'flex-col', 'transition', 'duration-200');


               if (i > paddingDays) {
                   const currentDayNum = i - paddingDays;
                   const dateStr = getFormatDateString(year, month, currentDayNum);
                  
                   // Style the day cell
                   daySquare.classList.add('hover:shadow-md', 'cursor-pointer', 'hover:border-indigo-300');
                   daySquare.addEventListener('click', () => openModal(dateStr, year, month, currentDayNum));


                   const dateHeader = document.createElement('div');
                   dateHeader.classList.add('text-sm', 'font-semibold', 'text-gray-700', 'mb-1');
                  
                   // Highlight today
                   const today = new Date();
                   if (currentDayNum === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                       dateHeader.innerHTML = `<span class="bg-indigo-600 text-white rounded-full w-7 h-7 flex items-center justify-center">${currentDayNum}</span>`;
                       daySquare.classList.add('bg-indigo-50/30', 'border-indigo-200');
                   } else {
                       dateHeader.innerText = currentDayNum;
                   }
                  
                   daySquare.appendChild(dateHeader);


                   // Render events for this day
                   const dayEvents = events[dateStr] || [];
                   const eventsContainer = document.createElement('div');
                   eventsContainer.classList.add('flex-1', 'overflow-y-auto', 'event-list', 'space-y-1');


                   dayEvents.forEach(eventObj => {
                       const eventEl = document.createElement('div');
                       const styleClass = eventStyles[eventObj.type] || 'bg-gray-100 text-gray-800';
                      
                       eventEl.className = `text-xs px-2 py-1 rounded border truncate flex justify-between items-center group transition ${styleClass}`;
                      
                       const titleSpan = document.createElement('span');
                       titleSpan.innerText = eventObj.title;
                       titleSpan.className = 'truncate pointer-events-none';
                       eventEl.appendChild(titleSpan);


                       // Delete button
                       const delBtn = document.createElement('button');
                       delBtn.innerHTML = '&times;';
                       delBtn.className = 'ml-1 opacity-0 group-hover:opacity-100 text-lg leading-none focus:outline-none hover:scale-110 transition-transform';
                       delBtn.onclick = (e) => {
                           e.stopPropagation(); // Stop opening the modal when deleting
                           deleteEvent(dateStr, eventObj.id);
                       };
                       eventEl.appendChild(delBtn);


                       eventsContainer.appendChild(eventEl);
                   });


                   daySquare.appendChild(eventsContainer);
               } else {
                   // Padding day
                   daySquare.classList.add('bg-gray-50', 'opacity-50');
               }


               calendar.appendChild(daySquare);
           }
       }


       function changeMonth(offset) {
           nav += offset;
           load();
       }


       function goToToday() {
           nav = 0;
           load();
       }


       function openModal(dateStr, year, month, day) {
           clickedDateStr = dateStr;
          
           // Format for display
           const displayDate = new Date(year, month, day).toLocaleDateString('en-us', {
               weekday: 'long', month: 'short', day: 'numeric', year: 'numeric'
           });
           selectedDateDisplay.innerText = `Adding to: ${displayDate}`;
          
           document.getElementById('eventTitle').value = '';
           document.getElementById('eventType').value = 'Homework'; // Default
          
           eventModal.classList.remove('hidden');
           setTimeout(() => {
               document.getElementById('eventTitle').focus();
           }, 100);
       }


       function closeModal() {
           eventModal.classList.add('hidden');
           clickedDateStr = null;
       }


       function saveEvent(e) {
           e.preventDefault();
          
           if (!clickedDateStr) return;


           const title = document.getElementById('eventTitle').value.trim();
           const type = document.getElementById('eventType').value;
          
           if (title) {
               if (!events[clickedDateStr]) {
                   events[clickedDateStr] = [];
               }
              
               // Add event with unique ID
               events[clickedDateStr].push({
                   id: Date.now().toString(),
                   title: title,
                   type: type
               });


               // Save and update
               localStorage.setItem('calendarEvents', JSON.stringify(events));
               load();
               closeModal();
               showToast('Event saved successfully!');
           }
       }


       function deleteEvent(dateStr, id) {
           if (events[dateStr]) {
               events[dateStr] = events[dateStr].filter(event => event.id !== id);
              
               // Clean up empty arrays
               if (events[dateStr].length === 0) {
                   delete events[dateStr];
               }
              
               localStorage.setItem('calendarEvents', JSON.stringify(events));
               load();
               showToast('Event removed.');
           }
       }


       // Close modal on escape key
       document.addEventListener('keydown', (e) => {
           if (e.key === 'Escape' && !eventModal.classList.contains('hidden')) {
               closeModal();
           }
       });


       // Initialize calendar
       load();
   </script>
</body>
</html>
