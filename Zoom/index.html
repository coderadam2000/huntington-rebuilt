<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zoom</title>
<style>
/* Taco Minigames: shared look (copied into every minigame by Minigames/build.sh) */
:root { --mg: #38bdf8; --bg: #0b0f1a; --panel: rgba(17, 24, 39, .92); --line: rgba(255,255,255,.12); --text: #e5e7eb; --dim: #94a3b8; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 60%); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; user-select: none; }
.hidden { display: none !important; }
#mg-lobby, #mg-res { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 8, 16, .72); backdrop-filter: blur(4px); }
.mg-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; max-width: 640px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.mg-kicker { font: 700 11px ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; color: var(--mg); }
.mg-card h1 { margin: 6px 0 4px; font-size: 40px; font-weight: 900; letter-spacing: .01em; text-shadow: 0 0 24px color-mix(in srgb, var(--mg) 50%, transparent); }
.mg-sub { color: var(--dim); margin: 4px 0 10px; } .mg-how { font-size: 14px; color: #cbd5e1; margin: 8px 0 14px; line-height: 1.5; }
.mg-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 10px 0; }
.mg-btn { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; font: 800 15px system-ui, sans-serif; cursor: pointer; }
.mg-btn:hover { border-color: var(--mg); } .mg-btn.big { background: var(--mg); color: #06101f; border-color: var(--mg); }
.mg-btn:disabled { opacity: .45; cursor: default; }
#mg-code { width: 140px; text-align: center; font: 800 18px system-ui; letter-spacing: .15em; padding: 9px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: #fff; }
#mg-st { min-height: 20px; color: #bae6fd; font-size: 14px; } #mg-st.bad { color: #fda4af; }
.mg-code { font-size: 16px; margin: 8px 0; } .mg-code b { color: var(--mg); font-size: 26px; letter-spacing: .2em; }
#mg-people { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
.mg-chip { background: rgba(255,255,255,.07); border-radius: 999px; padding: 4px 10px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; } .mg-chip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; } .mg-chip small { color: var(--dim); }
select { background: rgba(0,0,0,.4); color: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: 700 14px system-ui; }
label { color: var(--dim); font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.mg-res-row { display: flex; justify-content: space-between; padding: 8px 6px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 17px; } .mg-res-row b { color: var(--mg); }
.mg-hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; font: 800 14px system-ui; pointer-events: none; }
.mg-hud span { background: rgba(0,0,0,.45); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
canvas { display: block; }
.mg-btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 9px; vertical-align: middle; }
#mg-snd { position: fixed; top: 10px; right: 10px; z-index: 70; min-width: 40px; min-height: 36px; font-size: 16px; }
#mg-name { width: 170px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: #fff; font: 700 15px system-ui; user-select: text; }
#mg-ready { color: #bbf7d0; margin: 2px 0 6px; }
#mg-confirm { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 8, 16, .72); }
#mg-confirm .mg-card { max-width: 420px; } #mg-confirm h2 { margin: 4px 0; }

/* ZOOM: menus and HUD (the lobby look comes from 00-mg.css) */
:root { --mg: #f97316; --z1: #f97316; --z2: #facc15; --z3: #ec4899; }
body { background: #000; user-select: none; }
#zm-gl { position: fixed; inset: 0; width: 100vw !important; height: 100vh !important; }
.zm-screen { position: fixed; z-index: 30; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(980px, 94vw); max-height: 92vh; overflow: auto;
  background: rgba(10, 12, 24, .82); border: 1px solid rgba(255,255,255,.14); border-radius: 22px; padding: 20px 24px; box-shadow: 0 24px 80px rgba(0,0,0,.55); backdrop-filter: blur(6px); text-align: center; }
.zm-screen.side { left: auto; right: 2vw; transform: translate(0, -50%); width: min(520px, 52vw); }
.zm-screen h2 { margin: 2px 0 6px; font-size: 30px; font-weight: 900; } .zm-screen h2 small { font-size: 15px; color: var(--dim); font-weight: 700; }
.zm-sub { color: var(--dim); margin: 2px 0 12px; }
.zm-logo { font: 900 84px/0.9 system-ui, sans-serif; letter-spacing: -.02em; font-style: italic; background: linear-gradient(90deg, var(--z2), var(--z1) 45%, var(--z3)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 rgba(0,0,0,.45)); margin: 4px 0 4px; }
.zm-logo span { display: block; font: 800 13px ui-monospace, monospace; letter-spacing: .35em; text-transform: uppercase; color: #fde68a; -webkit-text-fill-color: #fde68a; font-style: normal; margin-top: 8px; }
.zm-wallet { font-weight: 800; color: #fde68a; margin: 6px 0 10px; } .zm-wallet small { color: var(--dim); font-weight: 600; }
.zm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0; }
.zm-mode { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 10px; border-radius: 16px; border: 1px solid rgba(255,255,255,.12); background: linear-gradient(160deg, rgba(249,115,22,.22), rgba(236,72,153,.12)); color: #fff; cursor: pointer; font: inherit; transition: transform .1s, border-color .1s; }
.zm-mode:hover, .zm-mode:focus-visible { transform: translateY(-2px); border-color: var(--z2); }
.zm-mode span { font-size: 30px; } .zm-mode b { font-size: 18px; font-weight: 900; } .zm-mode small { color: #cbd5e1; font-size: 12px; line-height: 1.3; }
.zm-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 10px 0; }
.zm-btn { background: rgba(255,255,255,.09); color: #fff; border: 1px solid rgba(255,255,255,.16); border-radius: 12px; padding: 10px 18px; font: 800 15px system-ui, sans-serif; cursor: pointer; }
.zm-btn:hover { border-color: var(--z2); } .zm-btn.big { background: linear-gradient(90deg, var(--z1), var(--z3)); border-color: transparent; font-size: 17px; padding: 11px 26px; }
.zm-btn.wide { min-width: 320px; font-size: 17px; background: rgba(56,189,248,.18); border-color: rgba(56,189,248,.5); }
.zm-chip { background: rgba(255,255,255,.07); color: #e5e7eb; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 7px 14px; font: 800 14px system-ui; cursor: pointer; }
.zm-chip small { color: var(--dim); font-weight: 600; } .zm-chip.sel { background: var(--z1); border-color: var(--z1); color: #111; } .zm-chip.sel small { color: #3b1d06; }
.zm-lab { color: var(--dim); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; margin-right: 4px; }
.zm-check { color: #e5e7eb; font-weight: 700; }
.zm-tracks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.zm-track { display: flex; flex-direction: column; align-items: center; padding: 8px; border-radius: 14px; border: 2px solid rgba(255,255,255,.08); background: rgba(255,255,255,.05); color: #fff; cursor: pointer; font: inherit; }
.zm-track canvas { width: 120px; height: 80px; } .zm-track b { font-size: 14px; } .zm-track small { color: var(--dim); font-size: 11px; }
.zm-track.sel, .zm-cup.sel { border-color: var(--z2); background: rgba(250,204,21,.12); }
.zm-cups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0; }
.zm-cup { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 16px 10px; border-radius: 16px; border: 2px solid rgba(255,255,255,.08); background: linear-gradient(160deg, color-mix(in srgb, var(--c) 28%, transparent), rgba(0,0,0,.2)); color: #fff; cursor: pointer; font: inherit; }
.zm-cup span { font-size: 40px; } .zm-cup b { font-size: 19px; } .zm-cup small { color: #cbd5e1; font-size: 12px; } .zm-cup em { font-style: normal; color: #fde68a; font-size: 13px; min-height: 16px; }
.zm-cup.locked { opacity: .45; cursor: default; }
.zm-tabs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 6px 0 10px; }
.zm-parts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; max-height: 38vh; overflow: auto; padding: 2px; }
.zm-part { display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; padding: 8px 10px; border-radius: 12px; border: 2px solid rgba(255,255,255,.08); background: rgba(255,255,255,.05); color: #fff; cursor: pointer; font: inherit; }
.zm-part b { grid-column: 2; font-size: 14px; } .zm-part small { grid-column: 2; color: var(--dim); font-size: 11px; } .zm-part em { grid-column: 3; grid-row: 1 / 3; font-style: normal; font-size: 12px; color: #fde68a; font-weight: 800; }
.zm-part .sw { grid-row: 1 / 3; width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); }
.zm-part.sel { border-color: var(--z2); } .zm-part.buy { opacity: .82; } .zm-part.shake { animation: zshake .35s; }
@keyframes zshake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.zm-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; margin: 12px 0 4px; text-align: left; font-size: 13px; }
.zm-stats > div { display: flex; justify-content: space-between; align-items: center; } .zm-stats span { color: #cbd5e1; font-weight: 700; }
.bar { display: inline-flex; gap: 3px; } .bar i { width: 16px; height: 9px; border-radius: 3px; background: rgba(255,255,255,.12); } .bar i.on { background: linear-gradient(90deg, var(--z2), var(--z1)); }
.zm-statrow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 8px 0; } .zm-statrow div { background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px 4px; color: var(--dim); font-size: 12px; } .zm-statrow b { display: block; color: #fff; font-size: 22px; }
.zm-cupgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0; } .zm-cupgrid div { background: rgba(255,255,255,.05); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #cbd5e1; } .zm-cupgrid b { color: #fff; }
.zm-tab { width: 100%; border-collapse: collapse; font-size: 14px; } .zm-tab td, .zm-tab th { padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,.08); text-align: left; } .zm-tab th { color: var(--dim); font-size: 12px; text-transform: uppercase; }
.zm-how { text-align: left; font-size: 14px; line-height: 1.5; color: #e2e8f0; } .zm-how p { margin: 6px 0; }
.zm-items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; } .zm-items div { display: grid; grid-template-columns: 34px 1fr; background: rgba(255,255,255,.05); border-radius: 10px; padding: 6px; } .zm-items span { grid-row: 1 / 3; font-size: 24px; } .zm-items small { color: var(--dim); font-size: 11px; line-height: 1.25; }
.zm-rtab { margin: 8px 0; } .zm-rrow { display: grid; grid-template-columns: 54px 1fr auto 90px auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 10px; font-weight: 700; text-align: left; }
.zm-rrow:nth-child(odd) { background: rgba(255,255,255,.04); } .zm-rrow.me { background: rgba(250,204,21,.18); outline: 1px solid rgba(250,204,21,.5); }
.zm-rrow .pl { font-weight: 900; color: var(--z2); font-size: 18px; } .zm-rrow small { color: var(--dim); } .zm-rrow b { color: #fde68a; }
.zm-reward { color: #fde68a; font-weight: 800; margin: 6px 0; } .zm-trophy { font-size: 96px; line-height: 1.1; animation: zpop .6s; }
@keyframes zpop { from { transform: scale(.3) rotate(-20deg); } to { transform: none; } }
#zm-pause, #zm-wait { width: min(520px, 90vw); }
/* lobby additions */
#zm-roomset { margin: 6px 0; } .zm-roomrow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; } .zm-roomsum { color: #fde68a; font-weight: 700; }
#zm-lobback { margin-top: 8px; }
/* HUD */
#zm-hud { position: fixed; inset: 0; z-index: 20; pointer-events: none; font-family: system-ui, sans-serif; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
#zm-tl { position: absolute; left: 16px; top: 12px; } #zm-lap { font: 900 30px system-ui; font-style: italic; } #zm-time { font: 800 20px ui-monospace, monospace; } #zm-info { font-weight: 700; color: #fde68a; }
#zm-place { position: absolute; right: 18px; top: 56px; font: 900 76px/1 system-ui; font-style: italic; } #zm-place i { font-size: 34px; } #zm-place small { font-size: 22px; color: #cbd5e1; font-style: normal; }

<body>
<div id="app"></div>
<script type="module">
// ---- 00-mg.js ----
// ==========================================
// TACO MINIGAMES: the shared lobby (copied into every minigame by Minigames/build.sh; edit it here).
// Play vs bots right away, or open a room (6-digit code, HGNet = the launcher's multiplayer network) and friends
// join; the host adds bots to fill seats and starts. The host runs the game (and the bots) and tells everyone.
// A game calls MG.init({...}) and gets onStart(roster, seed), onMsg(peerId, msg), onLeave(id) back.
// ==========================================
const MG = { cfg: null, net: null, host: false, solo: false, code: '', me: 0, name: '', roster: [], started: false, bots: 1, adT: 0 };
const MG_BOTS = ['Byte', 'Pixel', 'Turbo', 'Glitch', 'Echo', 'Nova', 'Bolt', 'Rusty', 'Sprocket', 'Zippy'];
const MG_COLS = ['#38bdf8', '#f472b6', '#facc15', '#4ade80', '#a78bfa', '#fb923c', '#f87171', '#2dd4bf', '#e879f9', '#fde68a'];
function mgEl(id) { return document.getElementById(id); }
function mgEsc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function mgCol(i) { return MG_COLS[i % MG_COLS.length]; }
function mgHG() {

    return new Promise(res => { const s = document.createElement('script'); s.src = '../../gv/vendor/hgnet.js'; s.onload = () => res(window.HGNet || null); s.onerror = () => res(null); document.head.appendChild(s); });
}
function mgLauncherName() { try { const L = window.parent && window.parent.HGGrapevine, me = L && L.me(); if (me) return me.name; } catch (e) {} return ''; }
function mgMyName() {
    const ln = mgLauncherName(); if (ln) return ln;
    try { let n = localStorage.getItem('hgmini_name'); if (!n) { n = 'Player ' + (100 + Math.floor(Math.random() * 900)); localStorage.setItem('hgmini_name', n); } return n; } catch (e) { return 'Player'; }
}
function mgLs(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function mgSay(t, bad) { const e = mgEl('mg-st'); if (e) { e.textContent = t; e.className = bad ? 'bad' : ''; } }
// ---- the lobby screen
MG.init = function (cfg) {
    MG.cfg = Object.assign({ min: 2, max: 8, bots: 7, defBots: 1, color: '#38bdf8', solo: true }, cfg);
    document.documentElement.style.setProperty('--mg', MG.cfg.color);
    const d = document.createElement('div'); d.id = 'mg-lobby';
    d.innerHTML = `<div class="mg-card"><div class="mg-kicker">Taco Minigames</div><h1>${mgEsc(cfg.title)}</h1><p class="mg-sub">${cfg.sub || ''}</p>
      <div class="mg-how">${cfg.howto || ''}</div>
      <div class="mg-row">${MG.cfg.solo ? '<button class="mg-btn big" id="mg-solo">Play vs bots</button>' : ''}<button class="mg-btn" id="mg-host">Open a room</button>
        <input id="mg-code" maxlength="7" inputmode="numeric" placeholder="6-digit code" autocomplete="off"><button class="mg-btn" id="mg-join">Join</button></div>
      <div class="mg-row hidden" id="mg-namerow"><label>Your name <input id="mg-name" maxlength="16" autocomplete="off"></label></div>
      <div id="mg-st"></div>
      <div id="mg-room" class="hidden"><div class="mg-code">Room code <b id="mg-codev"></b> <button class="mg-btn sm" id="mg-copy" title="Copy the room code">Copy</button></div><div id="mg-people"></div>
        <div class="mg-row" id="mg-hostrow"><label>Bots <select id="mg-bots"></select></label><button class="mg-btn big" id="mg-start" title="Start (Enter)">Start</button></div>
        <div id="mg-ready" class="mg-sub hidden"></div>
        <div id="mg-wait" class="mg-sub hidden">Waiting for the host to start...</div></div></div>`;
    document.body.appendChild(d);
    const r = document.createElement('div'); r.id = 'mg-res'; r.className = 'hidden'; document.body.appendChild(r);
    const sel = mgEl('mg-bots'); for (let i = 0; i <= MG.cfg.bots; i++) sel.add(new Option(String(i), i)); sel.value = MG.cfg.defBots;
    const bk = 'hgmini_bots_' + MG.cfg.id, sb = parseInt(mgLs(bk), 10);     // the bot count you picked last time
    sel.onchange = () => { MG.bots = +sel.value; mgLs(bk, String(MG.bots)); mgLobbySend(); };
    MG.bots = sb >= 0 && sb <= MG.cfg.bots ? sb : MG.cfg.defBots; sel.value = MG.bots;
    if (!mgLauncherName()) {     // not signed in to the launcher: the name can be changed here and is remembered
        const ni = mgEl('mg-name'); mgEl('mg-namerow').classList.remove('hidden'); ni.value = mgMyName();
        ni.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') ni.blur(); };
        ni.onchange = () => { const v = ni.value.replace(/\s+/g, ' ').trim().slice(0, 16); if (v) mgLs('hgmini_name', v); ni.value = mgMyName(); };
    }
    mgEl('mg-copy').onclick = () => mgCopyCode();
    mgQolInit();
    if (mgEl('mg-solo')) mgEl('mg-solo').onclick = () => mgSolo();
    mgEl('mg-host').onclick = () => mgHost();
    mgEl('mg-join').onclick = () => mgJoin(mgEl('mg-code').value);
    mgEl('mg-code').onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') mgJoin(mgEl('mg-code').value); };
    mgEl('mg-start').onclick = () => mgStart();
    // the launcher: invites, open parties, Quick Match
    window.__hgJoin = c => { mgShowLobby(); mgEl('mg-code').value = c; mgJoin(c); return true; };
    window.__hgHost = convId => { mgShowLobby(); mgHost(); const iv = setInterval(() => { if (MG.code) { clearInterval(iv); try { window.parent.HG_sendInvite(convId, { game: MG.cfg.id, code: MG.code, max: MG.cfg.max }); } catch (e) {} } }, 300); setTimeout(() => clearInterval(iv), 25000); };
    setTimeout(() => { try { const p = window.parent; if (!p || p === window) return; const c = p.HG_takeJoin && p.HG_takeJoin(MG.cfg.id); if (c) return window.__hgJoin(c); const h = p.HG_takeHost && p.HG_takeHost(MG.cfg.id); if (h && h.convId) window.__hgHost(h.convId); } catch (e) {} }, 400);
    window.__mg = MG;
};
function mgShowLobby() { mgEl('mg-lobby').classList.remove('hidden'); mgEl('mg-res').classList.add('hidden'); }
function mgHideLobby() { mgEl('mg-lobby').classList.add('hidden'); mgEl('mg-res').classList.add('hidden'); }
function mgBotsFor(nHumans, n) { const out = []; for (let i = 0; i < Math.min(n, MG.cfg.max - nHumans); i++) out.push({ id: 100 + i, name: MG_BOTS[i % MG_BOTS.length] + ' (bot)', bot: true }); return out; }
function mgHumans() {
    const out = [{ id: 0, name: MG.host ? MG.name : ((MG.roster.find(r => r.id === 0) || {}).name || 'Host') }];
    if (MG.net && MG.host) for (const p of MG.net.peers()) if (!p.isHost && p.state !== 'left') out.push({ id: p.id, name: String(p.name || 'Player').slice(0, 16) });
    return out;
}
function mgRosterNow() { const h = mgHumans().slice(0, MG.cfg.max); return h.concat(mgBotsFor(h.length, MG.bots)).map((r, i) => Object.assign(r, { col: mgCol(i) })); }
function mgSolo() {
    MG.solo = true; MG.host = true; MG.me = 0; MG.name = mgMyName();
    const bots = Math.max(MG.cfg.min - 1, MG.bots || 1);
    MG.roster = [{ id: 0, name: MG.name }].concat(mgBotsFor(1, bots)).map((r, i) => Object.assign(r, { col: mgCol(i) }));
    mgBegin({ roster: MG.roster, seed: (Math.random() * 1e9) | 0 });
}
function mgWire(net) {
    net.on('message', (peer, m) => {
        if (!m || typeof m !== 'object') return;
        if (m.t === '_lobby' && !MG.host) { MG.roster = m.roster; MG.bots = m.bots; if (m.room && !MG.started) mgShowLobby(); mgPaint(); return; }
        if (m.t === '_start' && !MG.host) return mgBegin(m);
        if (m.t === '_end' && !MG.host) return mgShowEnd(m.html, m.win);
        if (m.t === 'g' && MG.cfg.onMsg) MG.cfg.onMsg(peer.id, m.d);
    });
    net.on('join', () => { if (MG.host) mgLobbySend(); });
    net.on('leave', peer => { if (MG.host) { if (!MG.started) mgLobbySend(); else if (MG.cfg.onLeave) MG.cfg.onLeave(peer.id); } mgPaint(); });
    net.on('closed', (r, t) => { if (MG.net !== net) return; MG.net = null; MG.code = ''; MG.started = false; mgShowLobby(); mgEl('mg-room').classList.add('hidden'); mgConfirmClose(); mgSay(r === 'host-left' ? 'The host left, so the room closed. Open your own room or play vs bots.' : 'Disconnected' + (t ? ': ' + t : '.'), true); if (MG.cfg.onQuit) MG.cfg.onQuit(); });
}
function mgHost() {
    if (MG.net) return; mgSay('Opening a room...');
    mgHG().then(HG => {
        if (!HG) return mgSay('Playing with friends needs the Taco Games launcher. "Play vs bots" works anywhere.', true);
        MG.name = mgMyName(); const net = MG.net = HG.create({ game: MG.cfg.id }); mgWire(net);
        net.host({ name: MG.name, maxPlayers: MG.cfg.max, accept: () => MG.started ? 'That game has already started.' : true }).then(r => {
            MG.host = true; MG.solo = false; MG.code = r.code; MG.me = 0; mgSay('Room open: share the code, add bots if you like, then Start.'); mgLobbySend(); mgAdvertise();
        }, e => { MG.net = null; mgSay(e.message || 'Could not open a room.', true); });
    });
}
function mgJoin(code) {
    code = String(code || '').replace(/\D/g, ''); if (code.length !== 6) return mgSay('Type the 6-digit code.', true);
    if (MG.net) return; mgSay('Joining...');
    mgHG().then(HG => {
        if (!HG) return mgSay('Playing with friends needs the Taco Games launcher.', true);
        MG.name = mgMyName(); const net = MG.net = HG.create({ game: MG.cfg.id }); mgWire(net);
        net.join(code, { name: MG.name }).then(r => { MG.host = false; MG.solo = false; MG.code = r.code || code; MG.me = r.id; mgSay('In the room. The host starts the game.'); mgPaint(); },
            e => { MG.net = null; mgSay(e.message || 'Could not join.', true); });
    });
}
function mgAdvertise() {
    clearInterval(MG.adT);
    const ad = () => { try { const p = window.parent; if (p && p !== window && p.HG_partyOpen && MG.host && MG.net && !MG.started) p.HG_partyOpen({ game: MG.cfg.id, code: MG.code, n: mgHumans().length, max: MG.cfg.max, mode: MG.cfg.title }); } catch (e) {} };
    ad(); MG.adT = setInterval(ad, 30000);
}
function mgLobbySend(room) { if (!MG.host || !MG.net) return; MG.roster = mgRosterNow(); MG.net.send('all', room ? { t: '_lobby', roster: MG.roster, bots: MG.bots, room: 1 } : { t: '_lobby', roster: MG.roster, bots: MG.bots }); mgPaint(); }
function mgPaint() {

    mgEl('mg-codev').textContent = MG.code;
    const roster = MG.host ? mgRosterNow() : MG.roster;
    mgEl('mg-people').innerHTML = roster.map(r => `<span class="mg-chip"><i style="background:${r.col}"></i>${mgEsc(r.name)}${r.id === 0 ? ' <small>host</small>' : ''}${r.id === MG.me ? ' <small>you</small>' : ''}</span>`).join('');
    mgEl('mg-hostrow').classList.toggle('hidden', !MG.host); mgEl('mg-wait').classList.toggle('hidden', MG.host);
    mgEl('mg-bots').value = MG.bots;
    const need = MG.cfg.min - roster.length; mgEl('mg-start').disabled = need > 0; mgEl('mg-start').textContent = need > 0 ? 'Need ' + need + ' more (add bots)' : 'Start';
    const humans = roster.filter(r => !r.bot).length, rd = mgEl('mg-ready');
    rd.classList.toggle('hidden', !MG.host);
    rd.textContent = need > 0 ? 'Waiting for players: share the code, or add bots.' : 'Ready! ' + humans + (humans === 1 ? ' player' : ' players') + ' here. Press Start or Enter when everyone has joined.';
}
function mgStart() {
    if (!MG.host) return;
    MG.roster = mgRosterNow(); if (MG.roster.length < MG.cfg.min) return;
    const m = { t: '_start', roster: MG.roster, seed: (Math.random() * 1e9) | 0 };
    if (MG.net) MG.net.send('all', m);
    mgBegin(m);
}
function mgBegin(m) {
    MG.started = true; MG.roster = m.roster; clearInterval(MG.adT);
    try { const p = window.parent; if (p && p !== window && p.HG_partyClose && MG.host && MG.code) p.HG_partyClose(MG.code); } catch (e) {}

    MG.cfg.onStart(MG.roster, m.seed);
}
// ---- during a game
MG.isHost = () => MG.host || MG.solo;
MG.send = (to, d, fast) => { if (MG.net) try { MG.net.send(to === 'host' ? 'host' : to, { t: 'g', d }, fast ? { fast: true } : undefined); } catch (e) {} };
MG.toAll = (d, fast) => MG.send('all', d, fast);
MG.toHost = (d, fast) => { if (MG.isHost()) { if (MG.cfg.onMsg) MG.cfg.onMsg(MG.me, d); } else MG.send('host', d, fast); };
MG.player = id => MG.roster.find(r => r.id === id);
// the host ends the game for everyone with a results card (html)
// win (2026-11-22): the winner's player id, or null for a draw; left out when there is no result (someone left).
// Every player counts their own matches and wins per game in 'hgmini_wins' (the launcher reads it for the leaderboards).
MG.end = (html, win) => { if (!MG.isHost()) return; if (MG.net) MG.net.send('all', { t: '_end', html, win }); mgShowEnd(html, win); };
function mgTally(win) {
    if (win === undefined || !MG.cfg.id) return;
    let s = null; try { s = JSON.parse(mgLs('hgmini_wins') || 'null'); } catch (e) {} s = s && typeof s === 'object' ? s : {};

function mgShowEnd(html, win) {
    MG.started = false; if (MG.cfg.onEnd) MG.cfg.onEnd(); mgTally(win);
    const r = mgEl('mg-res'); r.classList.remove('hidden');
    const room = !MG.solo && MG.isHost();
    r.innerHTML = `<div class="mg-card">${html}<div class="mg-row">${MG.isHost() ? '<button class="mg-btn big" id="mg-again" title="Enter or R">Play again</button>' : '<span class="mg-sub">Waiting for the host to start another round...</span>'}${room ? '<button class="mg-btn" id="mg-room-back" title="Change bots or wait for more people">Back to room</button>' : ''}<button class="mg-btn" id="mg-leave">${MG.solo ? 'Menu' : 'Leave'}</button></div>${room ? '<div class="mg-sub">Play again starts a new round for everyone in the room.</div>' : ''}</div>`;
    const toRoom = () => { r.classList.add('hidden'); mgShowLobby(); mgLobbySend(true); mgAdvertise(); };

function mgLeave() {

// ---- quality of life: sound toggle (M), copy code, keyboard, leave confirm (Esc)
function mgCopyCode() {
    const b = mgEl('mg-copy'), done = ok => { b.textContent = ok ? 'Copied!' : 'Copy failed'; setTimeout(() => { b.textContent = 'Copy'; }, 1500); };
    const fallback = () => { try { const t = document.createElement('textarea'); t.value = MG.code; document.body.appendChild(t); t.select(); const ok = document.execCommand('copy'); t.remove(); done(ok); } catch (e) { done(false); } };

function mgPaintSnd() { const b = mgEl('mg-snd'); if (b) { b.textContent = MGS.muted ? '🔇' : '🔊'; b.title = MGS.muted ? 'Sound off (M)' : 'Sound on (M)'; } }
function mgToggleSnd() { MGS.muted = !MGS.muted; mgLs('hgmini_mute', MGS.muted ? '1' : '0'); mgPaintSnd(); if (!MGS.muted) MGS.blip(); }
function mgVisible(id) { const e = mgEl(id); return !!e && !e.classList.contains('hidden'); }

    if (!c) {
        c = document.createElement('div'); c.id = 'mg-confirm'; c.className = 'hidden';
        c.innerHTML = '<div class="mg-card"><h2>Leave this match?</h2><p class="mg-sub" id="mg-confirm-t"></p><div class="mg-row"><button class="mg-btn big" id="mg-confirm-stay" title="Esc">Keep playing</button><button class="mg-btn" id="mg-confirm-go" title="Enter">Leave</button></div></div>';
        document.body.appendChild(c);
        mgEl('mg-confirm-stay').onclick = mgConfirmClose;
        mgEl('mg-confirm-go').onclick = () => { mgConfirmClose(); mgLeave(); };
    }

    c.classList.remove('hidden');
}
function mgQolInit() {
    MGS.muted = mgLs('hgmini_mute') === '1';
    const b = document.createElement('button'); b.id = 'mg-snd'; b.className = 'mg-btn sm'; b.onclick = e => { e.stopPropagation(); mgToggleSnd(); b.blur(); };

// ---- 70-net.js ----
// ==========================================
// ZOOM: online. The shared minigame lobby (MG, HGNet) makes the room. Each screen drives its own kart and sends
// where it is 15 times a second to the host; the host drives the bots and sends everyone a snapshot of every kart.
// Items: whoever uses one sends a spawn message and every screen simulates it; a hit is decided by the screen
// that drives the kart that was hit. The host decides knockouts, the end of a race and the next race.
// ==========================================

        case 'go': uiHideAll(); startSeries(o.cfg); break;

        case 'spark3': tone(1400, 0.08, 'triangle', 0.04); break;

        case 'land': noise(0.12, 0.06); break;
        case 'bonk': noise(0.15, 0.12); tone(110, 0.12, 'square', 0.06, 60); break;
        case 'bump': tone(160, 0.1, 'square', 0.05, 90); break;
        case 'hit': tone(400, 0.4, 'sawtooth', 0.06, 80); break;
        case 'boom': noise(0.7, 0.25); tone(90, 0.6, 'sawtooth', 0.08, 30); break;
        case 'shield': tone(1500, 0.2, 'sine', 0.06, 600); break;
        case 'storm': noise(0.9, 0.2, 200); tone(60, 0.8, 'sawtooth', 0.07, 40); break;
        case 'splat': noise(0.3, 0.12); tone(300, 0.2, 'sine', 0.06, 100); break;
        case 'fall': tone(600, 0.8, 'sine', 0.05, 120); break;
        case 'lap': tone(784, 0.12, 'triangle', 0.06); tone(1046, 0.18, 'triangle', 0.06, 0, 0.1); break;
        case 'final': [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.14, 'square', 0.05, 0, i * 0.09)); break;
        case 'win': [523, 659, 784, 1046, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.07, 0, i * 0.11)); break;
        case 'done': [523, 659, 784].forEach((f, i) => tone(f, 0.2, 'triangle', 0.06, 0, i * 0.12)); break;
        case 'lose': [392, 330, 262].forEach((f, i) => tone(f, 0.25, 'triangle', 0.06, 0, i * 0.14)); break;
        case 'ko': tone(300, 0.3, 'square', 0.05, 120); break;
        case 'buy': [784, 1046, 1568].forEach((f, i) => tone(f, 0.12, 'square', 0.05, 0, i * 0.07)); break;
        case 'no': tone(180, 0.2, 'square', 0.05, 120); break;
    }
}
// the engine: two detuned saws through a low-pass, pitched by speed
function engineSound() {
    const K = Z.me, a = (Z.state === 'race' && !Z.paused && K) ? auCtx() : null;
    if (!a) { if (AU.eng) { AU.eng.g.gain.setTargetAtTime(0, AU.ac.currentTime, 0.05); } return; }
    if (!AU.eng) {
        const o1 = a.createOscillator(), o2 = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
        o1.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 600; g.gain.value = 0;
        o1.connect(f); o2.connect(f); f.connect(g); g.connect(AU.master); o1.start(); o2.start(); AU.eng = { o1, o2, f, g };
    }
    const r = clamp(Math.abs(K.sp) / K.S.top, 0, 1.4), base = (K.V.bike ? 70 : 52) + r * (K.V.bike ? 150 : 120) + (K.boost > 0 ? 30 : 0), t = a.currentTime;
    AU.eng.o1.frequency.setTargetAtTime(base, t, 0.05); AU.eng.o2.frequency.setTargetAtTime(base * 0.502, t, 0.05);
    AU.eng.f.frequency.setTargetAtTime(380 + r * 900, t, 0.08);
    AU.eng.g.gain.setTargetAtTime(K.out || K.finished ? 0.012 : 0.028 + r * 0.025, t, 0.08);
}
// music: a bass line and an arpeggio, scheduled a little ahead
const MUSIC = {
    meadow: [132, [0, 4, 7, 12], [0, 5, 7, 4]], beach: [120, [0, 4, 7, 9], [0, 9, 5, 7]], pine: [126, [0, 3, 7, 10], [0, 8, 3, 5]], city: [140, [0, 3, 7, 10], [0, 0, 8, 7]],
    desert: [128, [0, 1, 5, 7], [0, 5, 1, 0]], snow: [118, [0, 4, 7, 11], [0, 9, 4, 7]], factory: [146, [0, 3, 6, 10], [0, 0, 3, 6]], reef: [112, [0, 2, 7, 9], [0, 4, 9, 7]],
    volcano: [150, [0, 3, 7, 8], [0, 8, 5, 3]], sky: [124, [0, 4, 7, 14], [0, 5, 9, 7]], haunted: [116, [0, 3, 6, 9], [0, 1, 6, 3]], space: [138, [0, 7, 12, 15], [0, 3, 10, 7]]
};
function musicStart(theme) {
    musicStop(); const m = MUSIC[theme] || MUSIC.meadow; AU.step = 0; const a = auCtx(); if (!a) return;
    const spb = 60 / m[0] / 2, root = 110 * Math.pow(2, ((theme.length * 3) % 7) / 12);
    AU.next = a.currentTime + 0.1;
    AU.mus = setInterval(() => {
        const a2 = auCtx(); if (!a2 || Z.paused) return;
        while (AU.next < a2.currentTime + 0.25) {
            const s = AU.step++, bar = Math.floor(s / 8) % 4, chord = m[2][bar], dl = AU.next - a2.currentTime;
            if (s % 2 === 0) tone(root / 2 * Math.pow(2, chord / 12), spb * 1.6, 'triangle', 0.035, 0, dl);
            tone(root * 2 * Math.pow(2, (chord + m[1][s % 4]) / 12), spb * 0.9, 'square', 0.012, 0, dl);
            if (s % 4 === 2) noise(0.05, 0.03, 5000, dl);
            AU.next += spb;
        }
    }, 90);
}
function musicStop() { clearInterval(AU.mus); AU.mus = null; }

// ZOOM: start-up. The renderer, the loop, the lobby hook-up, and a debug handle for tests (window.__zoom).
// ==========================================
Z.scene = new THREE.Scene();
Z.cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.3, 1300);
Z.ren = new THREE.WebGLRenderer({ antialias: Z.save.opts.gfx > 0, powerPreference: 'high-performance' });
Z.ren.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(Z.ren.domElement); Z.ren.domElement.id = 'zm-gl';
function applyGfx() { Z.ren.setPixelRatio(Math.min(devicePixelRatio || 1, Z.save.opts.gfx > 0 ? 1.5 : 0.85)); Z.ren.setSize(innerWidth, innerHeight); }
function onResize() { Z.cam.aspect = innerWidth / innerHeight; UI.viewOff = -1; Z.cam.clearViewOffset(); Z.cam.updateProjectionMatrix(); applyGfx(); }
addEventListener('resize', onResize); applyGfx();

MG.init({
    id: 'zoom', title: 'Zoom', color: '#f97316', min: 1, max: 8, bots: 7, defBots: 3, solo: false,
    sub: 'Race your friends: open a room and share the code.',

mgEl('mg-lobby').classList.add('hidden');

const mgJoinHook = window.__hgJoin, mgHostHook = window.__hgHost;
window.__hgJoin = c => { showOnline(); return mgJoinHook(c); };
window.__hgHost = id => { showOnline(); return mgHostHook(id); };

let lastT = performance.now();
function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now; Z.t += dt;
    try {
        const p0 = performance.now();
        if (Z.state === 'race' || Z.state === 'results') { if (Z.state === 'race') raceTick(dt); else { psStep(Z.sparks, dt); camUpdate(dt); for (const K of Z.karts) kartVisual(K, dt); } }
        else showcaseTick(dt);
        if (Z.T && Z.T.boxes && Z.state !== 'race') for (const b of Z.T.boxes) b.m.rotation.y += dt;
        const p1 = performance.now(); Z.ren.render(Z.scene, Z.cam);
        Z.perf = { tick: p1 - p0, draw: performance.now() - p1, calls: Z.ren.info.render.calls };
    } catch (e) { console.error(e); if (!Z.errShown) { Z.errShown = true; toast('Something went wrong: ' + e.message); } }
}
showMenu();
requestAnimationFrame(frame);
// tests: window.__zoom.quick('meadow', 'race', 3) starts a solo race straight away
Z.quick = (track, mode, bots, cls) => { UI.pick = { mode: mode || 'race', cup: 0, track: track || 'meadow', cls: cls == null ? 1 : cls, bots: bots == null ? 3 : bots, items: true }; pickGo(); };
// tests: run the race simulation n steps without drawing
Z.sim = n => { for (let i = 0; i < n && Z.state === 'race'; i++) raceStep(1 / 60); };
Z.api = { botInit, TRACKS, ITEMS, BODIES, sampleTrack, trackProject, useItem, hitKart, endRace, startRace, showResults, MG };
