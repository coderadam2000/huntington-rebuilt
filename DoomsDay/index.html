      <div class="ar">${ARENAS.map((A, i) => `<button data-a="${i}" ${i < SV.unlocked ? '' : 'disabled'}><b>${i + 1}</b>${A.n}${SV.best[i] ? '<br>best ' + SV.best[i] : ''}</button>`).join('')}</div>
      <button class="db" id="d-play">PLAY</button><div class="keys">Click to look around (Esc to pause) · WASD move · SPACE jump · SHIFT sprint · click shoot · 1-4 / wheel weapons · R reload<br>Kills ${SV.kills} · arenas cleared ${SV.cleared}</div>`);
    $('d-play').onclick = () => begin(Math.min(SV.unlocked, 4) - 1); document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => begin(+b.dataset.a));
}
document.body.insertAdjacentHTML('beforeend', `<div id="hud"><div id="hurt"></div><div id="cross"></div><div id="top"></div><div id="bossbar" class="hidden"><i></i></div><div id="msg"></div><div id="hp" class="hstat"></div><div id="ar" class="hstat"></div><div id="am" class="hstat"></div><div id="weps"></div></div><div id="menu"></div>`);
// ---- input ----
function lock() { try { const r = $('cv').requestPointerLock && $('cv').requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && G.on) { G.paused = true; G.mouse = false; menu(`<h1 style="font-size:64px">PAUSED</h1><button class="db" id="d-res">Resume</button><button class="db alt" id="d-quit">Quit</button>`); $('d-res').onclick = () => { $('menu').classList.add('hidden'); G.paused = false; lock(); }; $('d-quit').onclick = mainMenu; } });
document.addEventListener('mousemove', e => { if (!document.pointerLockElement || !G.on) return; P.yaw -= e.movementX * .0022; P.pitch = clamp(P.pitch - e.movementY * .0022, -1.4, 1.4); });
$('cv').addEventListener('mousedown', e => { if (!G.on) return; if (!document.pointerLockElement) { lock(); return; } G.mouse = true; G.fired = false; });
addEventListener('mouseup', () => { G.mouse = false; });
addEventListener('keydown', e => { G.keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); const n = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(e.code); if (n >= 0 && P.have[n]) { P.w = n; P.rel = 0; gunGlow.material.color.setHex(WEPS[n].col); } if (e.code === 'KeyR') reload(); });
addEventListener('keyup', e => { G.keys[e.code] = false; });
addEventListener('wheel', e => { if (!G.on) return; let n = P.w; for (let i = 0; i < 4; i++) { n = (n + (e.deltaY > 0 ? 1 : 3)) % 4; if (P.have[n]) break; } P.w = n; P.rel = 0; gunGlow.material.color.setHex(WEPS[n].col); }, { passive: true });
let last = performance.now();
function frame(now) { requestAnimationFrame(frame); let dt = Math.min(.05, (now - last) / 1000); last = now; while (dt > 0) { const h = Math.min(1 / 60, dt); step(h); dt -= h; } if (G.on) hud(); if (G.world) R.render(scene, cam); }
buildArena(ARENAS[0]); cam.position.set(0, 3, 12); cam.lookAt(0, 1, 0); mainMenu(); requestAnimationFrame(frame);
// tests
Object.assign(window.__doom, { begin, step, fire, hurtE, spawnWave, save: () => SV });
