<script type="module">
// ---- 10-craft.js ----
// ==========================================
// CROCHET & KNITTING SIMULATOR: a cozy corner by the fire, a basket of yarn and a book of patterns.
//   Pick a pattern and a craft. Knitting: tap F and J in turn (left needle, right needle) with the soft metronome.
//   Crochet: tap SPACE (or click) with it. On the beat = an even stitch; early is tight, late is loose, and a big
//   miss drops a stitch (you can see every one in the finished piece). Hold nothing, rush nothing.
//   Finished pieces go on your shelf, or to the craft fair for coins (price: size x quality x the yarn you used).
//   Coins buy new patterns, nicer yarn (worth more), better tools (a wider window) and things for your room.
// Save (synced, prefix taco): taco.craft.v1 = { coins, pats, yarn, tools, decor, shelf: [{ p, q, c }], made, sold }
// ==========================================
const cv = document.getElementById('cv'), g = cv.getContext('2d'), ui = document.getElementById('ui');
const KEY = 'taco.craft.v1';
let SV = { coins: 30, pats: ['coaster', 'scarf'], yarn: 'acrylic', yarns: ['acrylic'], tools: [], decor: [], shelf: [], made: 0, sold: 0, craft: 'knit' };
try { SV = Object.assign(SV, JSON.parse(localStorage.getItem(KEY) || '{}') || {}); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(SV)); } catch (e) {} };
// patterns: rows of colour letters (bottom row last). '.' = no stitch (the shape), letters index the palette
const PATS = {
    coaster: { n: 'Heart Coaster', cost: 0, pal: { a: '#f4c7c3', b: '#e05a63' }, rows: ['aaaaaaaaaa', 'aabbaabbaa', 'abbbbbbbba', 'abbbbbbbba', 'abbbbbbbba', 'aabbbbbbaa', 'aaabbbbaaa', 'aaaabbaaaa', 'aaaaaaaaaa', 'aaaaaaaaaa'] },
    scarf: { n: 'Cozy Scarf', cost: 0, pal: { a: '#7fb3d5', b: '#f6f1e7', c: '#e8a33d' }, rows: Array.from({ length: 30 }, (_, i) => (i % 6 < 3 ? 'a' : i % 6 === 3 ? 'c' : 'b').repeat(7)) },
    beanie: { n: 'Pompom Beanie', cost: 60, pal: { a: '#c0504d', b: '#f6f1e7', p: '#f6f1e7' }, rows: ['.....pppp.....', '....pppppp....', '.....pppp.....', '...aaaaaaaa...', '..aaaaaaaaaa..', '.aaaaaaaaaaaa.', 'aaaaaaaaaaaaaa', 'aaaaaaaaaaaaaa', 'abababababab ab'.replace(' ', ''), 'aaaaaaaaaaaaaa', 'bbbbbbbbbbbbbb', 'babababababab b'.replace(' ', ''), 'bbbbbbbbbbbbbb'] },
    mittens: { n: 'Snowy Mittens', cost: 90, pal: { a: '#2f6f8f', b: '#ffffff' }, rows: ['..aaaa..', '.aaaaaa.', 'aaaaaaaa', 'aabaabaa', 'aaaaaaaa', 'abaaaaba', 'aaaaaaaaaa', 'aaaaaaaaaa', 'aaaaaaaa.a', 'aaaaaaaa..', 'bbbbbbbb..', 'abababab..'] },
    square: { n: 'Granny Square', cost: 120, pal: { a: '#f2d16b', b: '#7aa874', c: '#e07a5f', d: '#f6f1e7' }, rows: ['dddddddddddd', 'dccccccccccd', 'dcbbbbbbbbcd', 'dcbaaaaaabcd', 'dcbaddddabcd', 'dcbadccdabcd', 'dcbadccdabcd', 'dcbaddddabcd', 'dcbaaaaaabcd', 'dcbbbbbbbbcd', 'dccccccccccd', 'dddddddddddd'] },
    bunny: { n: 'Amigurumi Bunny', cost: 160, pal: { a: '#f1e4d8', b: '#f4b6c2', e: '#3b2a24' }, rows: ['..a....a..', '.aba..aba.', '.aba..aba.', '.aba..aba.', '..aaaaaa..', '.aaaaaaaa.', 'aaeaaaaeaa', 'aaaaaaaaaa', 'aaaabbaaaa', '.aaaaaaaa.', '..aaaaaa..', '.aaaaaaaa.', 'aaaaaaaaaa', '.aa....aa.'] },
    sweater: { n: 'Holiday Sweater', cost: 240, pal: { a: '#2f6b4f', b: '#c0504d', w: '#f6f1e7' }, rows: ['....aaaaaa....', 'aaaaaaaaaaaaaa', 'aaawaaaaaawaaa', 'aawwwaaaawwwaa', 'aaawaaaaaawaaa', 'aaaaaaaaaaaaaa', 'bwbwbwbwbwbwbw', 'aaaaaaaaaaaaaa', 'aaaawwbbwwaaaa', 'aaaawbbbbwaaaa', 'aaaaawbbwaaaaa', 'aaaaaaaaaaaaaa', 'bbbbbbbbbbbbbb', 'bwbwbwbwbwbwbw'] },
    blanket: { n: 'Rainbow Blanket', cost: 360, pal: { a: '#e07a5f', b: '#f2a65a', c: '#f2d16b', d: '#7aa874', e: '#5b9bd5', f: '#9b7ec8' }, rows: Array.from({ length: 18 }, (_, i) => 'abcdef'[Math.floor(i / 3)].repeat(16)) }};
const YARNS = [{ id: 'acrylic', n: 'Acrylic', k: 1, cost: 0 }, { id: 'cotton', n: 'Cotton', k: 1.3, cost: 80 }, { id: 'wool', n: 'Merino wool', k: 1.7, cost: 200 }, { id: 'alpaca', n: 'Alpaca', k: 2.3, cost: 420 }, { id: 'cashmere', n: 'Cashmere', k: 3, cost: 800 }];
const TOOLS = [{ id: 'bamboo', n: 'Bamboo needles', d: 'Knitting: a wider window for an even stitch.', cost: 70 }, { id: 'ergo', n: 'Ergonomic hook', d: 'Crochet: a wider window for an even stitch.', cost: 70 }, { id: 'metro', n: 'Wooden metronome', d: 'Choose a slower or faster tempo.', cost: 120 }, { id: 'counter', n: 'Row counter', d: 'Finishing a row cleanly pays a bonus.', cost: 150 }];
const DECOR = [{ id: 'cat', n: 'A sleepy cat', cost: 100 }, { id: 'plant', n: 'Potted plants', cost: 60 }, { id: 'lamp', n: 'Reading lamp', cost: 80 }, { id: 'rug', n: 'Braided rug', cost: 90 }, { id: 'rain', n: 'Rain on the window', cost: 50 }];
const has = (list, id) => SV[list].includes(id);
// ---- the work in progress ----
const S = { on: false, pat: null, craft: 'knit', row: 0, col: 0, st: [], bpm: 84, t0: 0, beat: 0, lastHit: -9, next: 0, side: 0, turn: 0, done: false, hits: [], expect: 'F', msg: '', msgT: 0 };
window.__craft = S;
const rowsOf = p => p.rows.slice().reverse();      // we work from the bottom up
function startProject(id, craft) {
    const p = PATS[id]; Object.assign(S, { on: true, id, pat: p, craft, row: 0, col: 0, st: rowsOf(p).map(r => Array.from(r).map(() => null)), t0: performance.now() / 1000 + 1.2, beatN: 0, side: 0, turn: 0, done: false, hits: [], expect: 'F', msg: 'Ready...', msgT: 1 });
    S.period = 60 / S.bpm; skipBlank(); ui.innerHTML = '';
}
function skipBlank() { const R = rowsOf(S.pat); while (S.row < R.length) { const r = R[S.row]; while (S.col < r.length && r[S.col] === '.') { S.st[S.row][S.col] = 'skip'; S.col++; } if (S.col < r.length) return; S.row++; S.col = 0; S.turn = .6; if (S.row >= R.length) { finish(); return; } } }
const windowOf = () => (S.craft === 'knit' ? (has('tools', 'bamboo') ? 1.35 : 1) : (has('tools', 'ergo') ? 1.35 : 1));
function stitch(key) {
    if (!S.on || S.done || S.turn > 0) return;
    if (S.craft === 'knit' && key !== S.expect) { S.msg = 'Other needle: ' + S.expect; S.msgT = .8; tone(180, .12, 'triangle'); return; }
    const now = performance.now() / 1000, ph = (now - S.t0) / S.period, near = Math.round(ph), off = (ph - near) * S.period;      // seconds off the beat
    const w = .07 * windowOf(), err = Math.abs(off);
    const q = err < w ? 1 : err < w * 2.2 ? .7 : err < w * 3.6 ? .4 : 0;      // 0 = dropped stitch
    S.st[S.row][S.col] = { q, off: Math.max(-1, Math.min(1, off / (w * 3.6))) };
    S.hits.push(q); S.col++; if (S.craft === 'knit') S.expect = S.expect === 'F' ? 'J' : 'F';
    S.msg = q === 1 ? 'even' : q === .7 ? (off < 0 ? 'a bit tight' : 'a bit loose') : q > 0 ? (off < 0 ? 'tight!' : 'loose!') : 'dropped a stitch'; S.msgT = .6;
    tone(q >= .7 ? 520 + S.col * 6 : 260, .06, 'sine', 0, .03); clack();
    const R = rowsOf(S.pat); if (S.col >= R[S.row].length) { const clean = S.st[S.row].every(x => x === 'skip' || (x && x.q >= .7)); if (clean && has('tools', 'counter')) { SV.coins += 2; S.msg = 'clean row! +2'; S.msgT = 1; } S.row++; S.col = 0; S.turn = .7; if (S.row >= R.length) return finish(); }
    skipBlank();
}
function quality() { if (!S.hits.length) return 0; return S.hits.reduce((a, b) => a + b, 0) / S.hits.length; }
function finish() {
    S.done = true; S.on = false; const q = quality(), yarn = YARNS.find(y => y.id === SV.yarn) || YARNS[0];
    const count = S.hits.length, price = Math.round(count * .9 * q * yarn.k + 5);
    SV.made++; save(); tone(660, .3, 'triangle', 990); setTimeout(() => tone(880, .4, 'triangle', 1320), 160);
    const stars = q >= .95 ? 5 : q >= .85 ? 4 : q >= .7 ? 3 : q >= .5 ? 2 : 1;
    const piece = { p: S.id, q: Math.round(q * 100), c: S.craft, y: yarn.id, st: S.st.map(r => r.map(x => x === 'skip' ? -1 : x ? Math.round(x.q * 10) : 0)), price };
    ui.innerHTML = `<div class="cp"><h2>${S.pat.n} finished!</h2><div style="font-size:30px;color:#e9a07a">${'★'.repeat(stars)}${'☆'.repeat(5 - stars)}</div><canvas id="fin" width="260" height="220"></canvas>
      <p>${count} stitches · ${Math.round(q * 100)}% even · ${S.hits.filter(h => h === 0).length} dropped · ${yarn.n} ${S.craft === 'knit' ? 'knitted' : 'crocheted'}</p>
      <p>The craft fair would pay <b>${price} coins</b>.</p><button class="cb" id="c-sell">Sell it</button><button class="cb alt" id="c-keep">Keep it on my shelf</button></div>`;
    drawPiece(document.getElementById('fin').getContext('2d'), PATS[S.id], piece.st, 260, 220, S.craft);
    document.getElementById('c-sell').onclick = () => { SV.coins += price; SV.sold++; save(); book(); };
    document.getElementById('c-keep').onclick = () => { SV.shelf.push(piece); if (SV.shelf.length > 24) SV.shelf.shift(); save(); book(); };
}
// ---- sound: clacks and a soft metronome ----
let AC = null;
function tone(f, len, type, f2, vol) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), v = AC.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, AC.currentTime); if (f2) o.frequency.exponentialRampToValueAtTime(f2, AC.currentTime + len); v.gain.setValueAtTime(vol || .04, AC.currentTime); v.gain.exponentialRampToValueAtTime(.0005, AC.currentTime + len); o.connect(v); v.connect(AC.destination); o.start(); o.stop(AC.currentTime + len); } catch (e) {} }
function clack() { tone(1800, .03, 'square', 900, .015); }
// ---- drawing ----
function fit() { const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; }
addEventListener('resize', fit); fit();
// one stitch: a V for knitting, a little post for crochet; tight ones are narrow, loose ones wide and wobbly
function stitchShape(c, x, y, w, h, col, q, off, craft) {
    const tight = off < 0 ? -off : 0, loose = off > 0 ? off : 0, sw = w * (1 - tight * .35 + loose * .25), wob = loose * 2.5;
    c.save(); c.translate(x + w / 2, y + h / 2);
    if (q === 0) { c.strokeStyle = col; c.globalAlpha = .4; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-w * .3, -h * .3); c.lineTo(w * .3, h * .3); c.stroke(); c.restore(); return; }
    c.fillStyle = col; c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1;
