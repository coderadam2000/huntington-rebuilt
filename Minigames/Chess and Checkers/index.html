<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chess and Checkers</title>
<style>
/* Taco Minigames: shared look (copied into every minigame by Minigames/build.sh) */
:root { --mg: #38bdf8; --bg: #0b0f1a; --panel: rgba(17, 24, 39, .92); --line: rgba(255,255,255,.12); --text: #e5e7eb; --dim: #94a3b8; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 60%); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; user-select: none; }
.hidden { display: none !important; }
#mg-lobby, #mg-res { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 8, 16, .72); backdrop-filter: blur(4px); }
.mg-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; max-width: 640px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.mg-kicker { font: 700 11px ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; color: var(--mg); }
.mg-card h1 { margin: 6px 0 4px; font-size: 40px; font-weight: 900; letter-spacing: .01em; text-shadow: 0 0 24px color-mix(in srgb, var(--mg) 50%, transparent); }
.mg-sub { color: var(--dim); margin: 4px 0 10px; } .mg-how { font-size: 14px; color: #cbd5e1; margin: 8px 0 14px; line-height: 1.5; }
.mg-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 10px 0; }
.mg-btn { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; font: 800 15px system-ui, sans-serif; cursor: pointer; }
.mg-btn:hover { border-color: var(--mg); } .mg-btn.big { background: var(--mg); color: #06101f; border-color: var(--mg); }
.mg-btn:disabled { opacity: .45; cursor: default; }
#mg-code { width: 140px; text-align: center; font: 800 18px system-ui; letter-spacing: .15em; padding: 9px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: #fff; }
#mg-st { min-height: 20px; color: #bae6fd; font-size: 14px; } #mg-st.bad { color: #fda4af; }
.mg-code { font-size: 16px; margin: 8px 0; } .mg-code b { color: var(--mg); font-size: 26px; letter-spacing: .2em; }
#mg-people { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
.mg-chip { background: rgba(255,255,255,.07); border-radius: 999px; padding: 4px 10px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; } .mg-chip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; } .mg-chip small { color: var(--dim); }
select { background: rgba(0,0,0,.4); color: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: 700 14px system-ui; }
label { color: var(--dim); font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.mg-res-row { display: flex; justify-content: space-between; padding: 8px 6px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 17px; } .mg-res-row b { color: var(--mg); }
.mg-hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; font: 800 14px system-ui; pointer-events: none; }
.mg-hud span { background: rgba(0,0,0,.45); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
canvas { display: block; }
.mg-btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 9px; vertical-align: middle; }
#mg-snd { position: fixed; top: 10px; right: 10px; z-index: 70; min-width: 40px; min-height: 36px; font-size: 16px; }
#mg-name { width: 170px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: #fff; font: 700 15px system-ui; user-select: text; }
#mg-ready { color: #bbf7d0; margin: 2px 0 6px; }
#mg-confirm { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 8, 16, .72); }
#mg-confirm .mg-card { max-width: 420px; } #mg-confirm h2 { margin: 4px 0; }

/* Chess and Checkers: the board fills the height, the side panel sits next to it (under it on narrow screens) */
#app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10px; }
#cc-wrap { display: flex; gap: 18px; align-items: center; max-width: 100%; }
#cc-boardbox { display: flex; flex-direction: column; gap: 6px; }
#cc-board { --sz: min(calc((100vh - 110px) / 8), calc((100vw - 300px) / 8), 76px); display: grid; grid-template-columns: repeat(8, var(--sz)); grid-template-rows: repeat(8, var(--sz));
  border-radius: 8px; overflow: hidden; box-shadow: 0 16px 50px rgba(0,0,0,.55), 0 0 0 6px #3b2a1a; user-select: none; touch-action: none; }
.cc-sq { position: relative; display: grid; place-items: center; cursor: default; }
.cc-sq.lt { background: #f0d9b5; } .cc-sq.dk { background: #b58863; }
.cc-sq.ck.lt { background: #e8d3b0; } .cc-sq.ck.dk { background: #2f4f2f; }
.cc-sq.can { cursor: pointer; }
.cc-sq.last::before { content: ''; position: absolute; inset: 0; background: rgba(255, 214, 10, .32); }
.cc-sq.sel::before { content: ''; position: absolute; inset: 0; background: rgba(56, 189, 248, .45); }
.cc-sq.chk::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(239,68,68,.95) 10%, rgba(239,68,68,0) 70%); }
.cc-sq.tgt { cursor: pointer; } .cc-sq.tgt::after { content: ''; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(15, 23, 42, .35); }
.cc-sq.tgt.cap::after { width: 86%; height: 86%; background: none; border: 5px solid rgba(15, 23, 42, .35); box-sizing: border-box; }
.cc-sq i { position: absolute; font: 700 10px system-ui, sans-serif; font-style: normal; opacity: .6; color: #3b2a1a; pointer-events: none; }
.cc-sq.dk i { color: #f0d9b5; } .cc-sq i.rk { left: 3px; top: 2px; } .cc-sq i.fl { right: 4px; bottom: 1px; }
.pc { position: relative; font-size: calc(var(--sz) * .78); line-height: 1; pointer-events: none; font-family: 'Segoe UI Symbol', 'Noto Sans Symbols 2', 'DejaVu Sans', sans-serif; }
.pc.w { color: #fff; text-shadow: 0 0 1px #000, 0 0 1px #000, 0 0 2px #000, 0 2px 3px rgba(0,0,0,.5); }
.pc.b { color: #111; text-shadow: 0 0 1px #fff8, 0 2px 3px rgba(0,0,0,.4); }
.ckp { position: relative; width: 74%; height: 74%; border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--sz) * .4); pointer-events: none;
  box-shadow: inset 0 -5px 0 rgba(0,0,0,.28), inset 0 0 0 4px rgba(255,255,255,.12), 0 4px 6px rgba(0,0,0,.45); }
.ckp.d { background: radial-gradient(circle at 40% 35%, #ef4444, #991b1b); color: #fde68a; }
.ckp.l { background: radial-gradient(circle at 40% 35%, #fafaf9, #a8a29e); color: #92400e; }
.cc-pl { display: flex; align-items: center; gap: 8px; min-height: 26px; font-size: 15px; }
.cc-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #0008; } .cc-dot.w, .cc-dot.l { background: #f5f5f4; } .cc-dot.b { background: #111; border-color: #fff6; } .cc-dot.d { background: #dc2626; }
.cc-elo { font: 700 12px ui-monospace, monospace; color: var(--dim); }
.cc-rank { font: 800 10px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--rc); border: 1px solid var(--rc); border-radius: 6px; padding: 1px 6px; }
.cc-turn { margin-left: auto; font: 700 11px ui-monospace, monospace; color: #0b0f1a; background: var(--mg); border-radius: 6px; padding: 2px 7px; }
#cc-side { width: 250px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; max-height: calc(100vh - 40px); }
#cc-title { font: 800 12px ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; color: var(--mg); }
#cc-status { font-size: 15px; min-height: 40px; } .cc-check { color: #f87171; font-weight: 800; }
.cc-btns { display: flex; gap: 6px; } .cc-btns .mg-btn { flex: 1; padding: 7px 8px; font-size: 13px; }
#cc-moves { flex: 1; min-height: 60px; max-height: 40vh; overflow-y: auto; font: 13px ui-monospace, monospace; color: #cbd5e1; }
#cc-moves i { color: var(--dim); font-style: normal; display: inline-block; width: 30px; }
#cc-me { border-top: 1px solid var(--line); padding-top: 8px; font-size: 13px; color: var(--dim); }
.cc-mlbl { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; } .cc-mbig { font: 900 24px system-ui, sans-serif; color: var(--text); display: flex; gap: 8px; align-items: center; }
#cc-promo { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; gap: 6px; align-items: center; --sz: 60px; }
.cc-pq { background: #f0d9b5; border: 0; border-radius: 10px; width: 64px; height: 64px; cursor: pointer; } .cc-pq:hover { background: #fde68a; }
#cc-pick .mg-btn.on { background: var(--mg); color: #1c1206; border-color: var(--mg); }
#cc-pick select { font: inherit; padding: 6px 8px; border-radius: 8px; background: #1f2937; color: var(--text); border: 1px solid var(--line); }
@media (max-width: 760px) { #cc-wrap { flex-direction: column; } #cc-board { --sz: min(calc((100vw - 30px) / 8), calc((100vh - 330px) / 8)); } #cc-side { width: 100%; max-height: 200px; } }
/* material counter */
.cc-mat { display: inline-flex; align-items: center; gap: 0; margin-left: 4px; min-height: 18px; }
.cc-mat .pc { font-size: 19px; margin-right: -3px; } .cc-mat .pc.b { color: #1c1917; text-shadow: 0 0 2px #e7e5e4, 0 0 2px #e7e5e4, 0 0 3px #e7e5e4; } .cc-mat .pc.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.cc-mat .ckm { width: 11px; height: 11px; border-radius: 50%; margin-right: -2px; border: 1px solid #0008; } .cc-mat .ckm.d { background: #dc2626; } .cc-mat .ckm.l { background: #e7e5e4; }
.cc-mat b { font: 800 12px ui-monospace, monospace; color: #4ade80; margin-left: 7px; }
#cc-matbox { font-size: 12px; color: var(--dim); }
.cc-mbar { height: 8px; border-radius: 5px; background: #111; overflow: hidden; margin: 4px 0; border: 1px solid var(--line); } .cc-mbar i { display: block; height: 100%; background: #f5f5f4; transition: width .3s; }
#cc-matbox.ck .cc-mbar { background: #e7e5e4; } #cc-matbox.ck .cc-mbar i { background: #dc2626; }
.cc-mtxt { display: flex; justify-content: space-between; font: 700 12px ui-monospace, monospace; } .cc-mtxt b { color: var(--text); }

</style>
</head>

<div id="app"></div>
<script type="module">
// ---- 00-mg.js ----
// ==========================================
// TACO MINIGAMES: the shared lobby (copied into every minigame by Minigames/build.sh; edit it here).
// Play vs bots right away, or open a room (6-digit code, HGNet = the launcher's multiplayer network) and friends
// join; the host adds bots to fill seats and starts. The host runs the game (and the bots) and tells everyone.
// A game calls MG.init({...}) and gets onStart(roster, seed), onMsg(peerId, msg), onLeave(id) back.
// ==========================================
const MG = { cfg: null, net: null, host: false, solo: false, code: '', me: 0, name: '', roster: [], started: false, bots: 1, adT: 0 };
const MG_BOTS = ['Byte', 'Pixel', 'Turbo', 'Glitch', 'Echo', 'Nova', 'Bolt', 'Rusty', 'Sprocket', 'Zippy'];
const MG_COLS = ['#38bdf8', '#f472b6', '#facc15', '#4ade80', '#a78bfa', '#fb923c', '#f87171', '#2dd4bf', '#e879f9', '#fde68a'];
function mgEl(id) { return document.getElementById(id); }
function mgEsc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function mgCol(i) { return MG_COLS[i % MG_COLS.length]; }
function mgHG() {
    const h = window.HGNet || (() => { try { return window.parent && window.parent.HGNet; } catch (e) { return null; } })();
    if (h) return Promise.resolve(h);
    return new Promise(res => { const s = document.createElement('script'); s.src = '../../gv/vendor/hgnet.js'; s.onload = () => res(window.HGNet || null); s.onerror = () => res(null); document.head.appendChild(s); });
}
function mgLauncherName() { try { const L = window.parent && window.parent.HGGrapevine, me = L && L.me(); if (me) return me.name; } catch (e) {} return ''; }
function mgMyName() {
    const ln = mgLauncherName(); if (ln) return ln;
    try { let n = localStorage.getItem('hgmini_name'); if (!n) { n = 'Player ' + (100 + Math.floor(Math.random() * 900)); localStorage.setItem('hgmini_name', n); } return n; } catch (e) { return 'Player'; }
}
function mgLs(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function mgSay(t, bad) { const e = mgEl('mg-st'); if (e) { e.textContent = t; e.className = bad ? 'bad' : ''; } }
// ---- the lobby screen
MG.init = function (cfg) {
    MG.cfg = Object.assign({ min: 2, max: 8, bots: 7, defBots: 1, color: '#38bdf8', solo: true }, cfg);

const PIECE = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };
function ccDraw() {
    const box = document.getElementById('cc-board'); if (!CC.st) return;
    const flip = CC.flip, b = CC.st.b, chkK = isChess() && CH.inCheck(CC.st) ? CH.kingSq(b, CC.st.w) : -1;
    const targets = CC.sel >= 0 ? CC.moves.filter(m => (isChess() ? m.f : m.path[0]) === CC.sel) : [];
    const tset = new Set(targets.map(m => isChess() ? m.t : m.path[m.path.length - 1]));
    const lastSq = CC.last ? (isChess() ? [CC.last.f, CC.last.t] : CC.last.path) : [];
    const mine = !CC.over && ccTurnId() === MG.me;
    const movable = new Set(mine ? CC.moves.map(m => isChess() ? m.f : m.path[0]) : []);
    let h = '';
    for (let i = 0; i < 64; i++) {
        const s = flip ? 63 - i : i, r = s >> 3, c = s & 7, dark = (r + c) % 2 === 1, p = b[s];
        let cls = 'cc-sq ' + (dark ? 'dk' : 'lt') + (isChess() ? '' : ' ck');
        if (lastSq.includes(s)) cls += ' last'; if (s === CC.sel) cls += ' sel'; if (s === chkK) cls += ' chk'; if (tset.has(s)) cls += p ? ' tgt cap' : ' tgt'; if (movable.has(s)) cls += ' can';
        let inner = '';
        if (p) {
            if (isChess()) inner = `<span class="pc ${chWhite(p) ? 'w' : 'b'}">${PIECE[p.toUpperCase()]}</span>`;
            else inner = `<span class="ckp ${ckSide(p)}${ckKing(p) ? ' king' : ''}">${ckKing(p) ? '♛' : ''}</span>`;
        }
        const lab = (c === (flip ? 7 : 0) ? `<i class="rk">${8 - r}</i>` : '') + (r === (flip ? 0 : 7) ? `<i class="fl">${'abcdefgh'[c]}</i>` : '');
        h += `<div class="${cls}" data-s="${s}">${inner}${lab}</div>`;
    }
    box.innerHTML = h;
    ccPlayers(); ccStatus(); ccMoveList();
}
// ---- material counter (2026-11-21): what each side has taken, and who is ahead on points ----
// Chess: P 1, N 3, B 3, R 5, Q 9. Captured = the starting set minus what is on the board (a promoted piece counts as the
// pawn it was, so promotions do not show as captures). Checkers: a man is 1, a king 2.
const CC_PTS = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 0 }, CC_START = { P: 8, N: 2, B: 2, R: 2, Q: 1 };
function ccMaterial() {
    const b = CC.st.b, out = {};
    if (isChess()) {
        for (const w of [true, false]) {
            const n = { P: 0, N: 0, B: 0, R: 0, Q: 0 }; let pts = 0;
            for (const p of b) if (p && chWhite(p) === w && p.toUpperCase() !== 'K') { n[p.toUpperCase()]++; pts += CC_PTS[p.toUpperCase()]; }
            let promoted = 0; for (const k of ['N', 'B', 'R', 'Q']) promoted += Math.max(0, n[k] - CC_START[k]);
            const lost = { Q: Math.max(0, 1 - n.Q), R: Math.max(0, 2 - n.R), B: Math.max(0, 2 - n.B), N: Math.max(0, 2 - n.N), P: Math.max(0, 8 - n.P - promoted) };
            out[w ? 'w' : 'b'] = { pts, lost };
        }
    } else {
        for (const sd of ['d', 'l']) {
            let men = 0, kings = 0; for (const p of b) if (p && ckSide(p) === sd) { if (ckKing(p)) kings++; else men++; }
            out[sd] = { pts: men + kings * 2, men, kings, lost: { n: Math.max(0, 12 - men - kings) } };
        }
    }
    return out;
}
// the strip under a player's name: the enemy pieces they have taken, and +N when they are ahead
function ccMatHtml(side, M) {
    const opp = Object.keys(M).find(k => k !== side), took = M[opp].lost, adv = M[side].pts - M[opp].pts;
    let icons = '';
    if (isChess()) { for (const k of ['Q', 'R', 'B', 'N', 'P']) for (let i = 0; i < took[k]; i++) icons += `<span class="pc ${opp}">${PIECE[k]}</span>`; }
    else for (let i = 0; i < took.n; i++) icons += `<span class="ckm ${opp}"></span>`;
    return `<span class="cc-mat" title="Pieces taken and material advantage">${icons}${adv > 0 ? `<b>+${adv}</b>` : ''}</span>`;
}
function ccMatBar(M) {
    const [a, b] = isChess() ? ['w', 'b'] : ['d', 'l'], pa = M[a].pts, pb = M[b].pts, tot = pa + pb || 1, d = pa - pb;
    const nm = isChess() ? { w: 'White', b: 'Black' } : { d: 'Dark', l: 'Light' };
    const who = d === 0 ? 'Even' : `${nm[d > 0 ? a : b]} +${Math.abs(d)}`;
    const extra = isChess() ? '' : ` <small>(${M[a].kings} vs ${M[b].kings} kings)</small>`;
    return `<div class="cc-mlbl">Material</div><div class="cc-mbar"><i style="width:${(pa / tot * 100).toFixed(1)}%"></i></div><div class="cc-mtxt"><span>${pa}</span><b>${who}</b><span>${pb}</span></div>${extra}`;
}
function ccName(id) { const p = MG.player(id); return p ? p.name : '?'; }
function ccPlayers() {
    const sides = isChess() ? ['w', 'b'] : ['d', 'l'], bottom = CC.flip ? sides[1] : sides[0], top = CC.flip ? sides[0] : sides[1];
    const M = ccMaterial(), mb = document.getElementById('cc-matbox'); if (mb) { mb.innerHTML = ccMatBar(M); mb.className = isChess() ? 'chess' : 'ck'; }
    const card = side => { const id = CC.sides[side], e = CC.elo[id], turn = !CC.over && ccTurnSide() === side;
        const dot = isChess() ? `<span class="cc-dot ${side}"></span>` : `<span class="cc-dot ck ${side}"></span>`;
        return `${dot}<b>${mgEsc(ccName(id))}</b>${e ? ` <span class="cc-elo">${e}</span> ${ccRankHtml(e)}` : ''}${ccMatHtml(side, M)}${turn ? '<span class="cc-turn">to move</span>' : ''}`; };
    document.getElementById('cc-top').innerHTML = card(top); document.getElementById('cc-bot').innerHTML = card(bottom);
}
function ccStatus() {
    const el = document.getElementById('cc-status');
    document.getElementById('cc-title').textContent = (isChess() ? 'Chess' : 'Checkers') + (CC.rated ? ' · ranked' : '');
    if (CC.over && CC.res) { el.innerHTML = `<b>${CC.res.win === 'draw' ? 'Draw' : mgEsc(ccName(CC.sides[CC.res.win])) + ' wins'}</b><br>${mgEsc(CC.res.why)}`; return; }
    const id = ccTurnId(), mine = id === MG.me;
    el.innerHTML = mine ? '<b>Your move</b>' + (isChess() && CH.inCheck(CC.st) ? ' <span class="cc-check">Check!</span>' : '') + (!isChess() && CC.moves[0] && CC.moves[0].caps.length ? '<br><small>You must jump.</small>' : '')
        : `${mgEsc(ccName(id))} is thinking...`;
}
function ccMoveList() {
    const el = document.getElementById('cc-moves'); let h = '';
    for (let i = 0; i < CC.hist.length; i += 2) h += `<div><i>${i / 2 + 1}.</i> ${mgEsc(CC.hist[i])} ${CC.hist[i + 1] ? mgEsc(CC.hist[i + 1]) : ''}</div>`;
    el.innerHTML = h; el.scrollTop = el.scrollHeight;
}
function ccMeBox() {
    const s = ccSave(), g = s[CC.mode], el = document.getElementById('cc-me');
    if (el) el.innerHTML = `<div class="cc-mlbl">Your ${isChess() ? 'chess' : 'checkers'} rating</div><div class="cc-mbig">${g.elo} ${ccRankHtml(g.elo)}</div><small>${g.w} won · ${g.l} lost · ${g.d} drawn · best ${g.peak}</small>`;
}
// ---- input ----
document.getElementById('cc-board').addEventListener('pointerdown', e => {
    const sq = e.target.closest('.cc-sq'); if (!sq || CC.over || ccTurnId() !== MG.me) return;
    const s = +sq.dataset.s;
    const pick = CC.moves.filter(m => (isChess() ? m.f : m.path[0]) === CC.sel && (isChess() ? m.t : m.path[m.path.length - 1]) === s);
    if (pick.length) {
        if (isChess() && pick.length > 1 && pick[0].p) { ccAskPromo(pick); return; }
        ccSend(pick[0]); return;
    }
    CC.sel = CC.moves.some(m => (isChess() ? m.f : m.path[0]) === s) ? s : -1; MGS.blip && MGS.blip(); ccDraw();
});
function ccAskPromo(opts) {
    const box = document.getElementById('cc-promo'), w = CC.st.w;
    box.innerHTML = '<div class="mg-sub">Promote to</div>' + ['Q', 'R', 'B', 'N'].map(q => `<button class="cc-pq" data-q="${q}"><span class="pc ${w ? 'w' : 'b'}">${PIECE[q]}</span></button>`).join('');
    box.classList.remove('hidden');
    box.onclick = e => { const b = e.target.closest('[data-q]'); if (!b) return; box.classList.add('hidden'); ccSend(opts.find(m => m.p === b.dataset.q)); };
}
function ccSend(m) { CC.sel = -1; MG.toHost({ k: 'mv', id: ENG().id(m), g: CC.gid }); }
document.getElementById('cc-flip').onclick = () => { CC.flip = !CC.flip; ccDraw(); };
document.getElementById('cc-resign').onclick = () => { if (CC.over || !ccMySide()) return; if (!confirm('Resign this game?')) return; MG.toHost({ k: 'resign', g: CC.gid }); };
addEventListener('keydown', e => { if (e.key === 'f' && CC.st && !e.target.closest('input')) { CC.flip = !CC.flip; ccDraw(); } });
// ---- the host runs the game ----
function ccHostMove(from, mid) {
    if (CC.over || from !== ccTurnId()) return;
    const m = CC.moves.find(x => ENG().id(x) === mid); if (!m) return;
    const san = isChess() ? CH.san(CC.st, m) : mid.replace(/(\d+)/g, n => ckName(+n)).replace(/-/g, m.caps.length ? 'x' : '-');
    const r = ENG().play(CC.st, m);
    const msg = { k: 'st', st: r.st, last: m, san, res: r.res, g: CC.gid };
    MG.toAll(msg); ccOnState(msg);
}
const ckName = s => { const r = s >> 3, c = s & 7; return String(r * 4 + (c >> 1) + 1); };      // the usual 1-32 numbering
function ccBotTurn() {
    if (!MG.isHost() || CC.over) return;
    const p = MG.player(ccTurnId()); if (!p || !p.bot) return;
    const lv = CC_BOTS[CC.bot], st = CC.st, g = CC.gid;
    setTimeout(() => { if (CC.gid !== g || CC.over) return; const m = ENG().botMove(st, lv); if (m) ccHostMove(p.id, ENG().id(m)); }, 350 + Math.random() * 400);
}
function ccOnState(m) {
    if (m.g !== CC.gid) return;
    CC.st = m.st; CC.last = m.last; if (m.san) CC.hist.push(m.san);
    CC.moves = m.res ? [] : ENG().legal(CC.st); CC.sel = -1;
    if (m.res) ccFinish(m.res);
    if (MGS.blip) MGS.blip();
    ccDraw(); ccBotTurn();
}
function ccFinish(res) {
    if (CC.over) return; CC.over = true; CC.res = res;
    const mySide = ccMySide(); let line = '';
    if (CC.rated && mySide) {      // each player rates their own game
        const oppId = Object.values(CC.sides).find(id => id !== MG.me), opp = CC.elo[oppId] || 600;
        const score = res.win === 'draw' ? 0.5 : res.win === mySide ? 1 : 0;
        const r = ccRate(CC.mode, opp, score);
        line = `<p class="mg-sub">Your ${isChess() ? 'chess' : 'checkers'} rating: <b>${r.elo}</b> (${r.delta >= 0 ? '+' : ''}${r.delta}) ${ccRankHtml(r.elo)}</p>`;
        try { const p = window.parent; if (p && p !== window && p.feedNow) setTimeout(() => p.feedNow(), 500); } catch (e) {}
    }
    ccMeBox();
    if (MG.isHost()) setTimeout(() => {
        const head = res.win === 'draw' ? 'Draw!' : mgEsc(ccName(CC.sides[res.win])) + ' wins!';
        MG.end(`<h1>${head}</h1><p class="mg-sub">${mgEsc(res.why)}</p><div id="cc-endrate"></div>`);
    }, 1600);
    CC.endLine = line;
}
// ---- lobby extras: which game, which bot, your ratings ----
function ccLobbyExtras() {
    const card = document.querySelector('#mg-lobby .mg-card'); if (!card || document.getElementById('cc-pick')) return;
    const s = ccSave(); CC.mode = s.mode === 'checkers' ? 'checkers' : 'chess'; CC.bot = Math.max(0, Math.min(7, s.bot | 0 || 2));
    const d = document.createElement('div'); d.id = 'cc-pick';
    d.innerHTML = `<div class="mg-row cc-modes"><button class="mg-btn" data-mode="chess">♞ Chess</button><button class="mg-btn" data-mode="checkers">⛂ Checkers</button></div>
      <div class="mg-row"><label>Bot <select id="cc-botsel">${CC_BOTS.map((b, i) => `<option value="${i}">${b.n} (${b.elo})</option>`).join('')}</select></label></div>
      <div id="cc-myrate" class="mg-sub"></div>`;
    card.insertBefore(d, card.querySelector('.mg-row'));
    const paint = () => { d.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === CC.mode));
        const s2 = ccSave(); document.getElementById('cc-myrate').innerHTML = `Your ratings: chess <b>${s2.chess.elo}</b> ${ccRankHtml(s2.chess.elo)} · checkers <b>${s2.checkers.elo}</b> ${ccRankHtml(s2.checkers.elo)}<br><small>Every finished game is ranked. Bot ratings are estimates.</small>`; };
    d.onclick = e => { const b = e.target.closest('[data-mode]'); if (!b) return; CC.mode = b.dataset.mode; const s2 = ccSave(); s2.mode = CC.mode; ccWrite(s2); paint(); };
    const sel = document.getElementById('cc-botsel'); sel.value = CC.bot;
    sel.onchange = () => { CC.bot = +sel.value; const s2 = ccSave(); s2.bot = CC.bot; ccWrite(s2); };
    sel.onkeydown = e => e.stopPropagation();
    paint();
}
MG.init({
    id: 'mg-chess', title: 'Chess and Checkers', color: '#d4a373', min: 2, max: 2, bots: 1, defBots: 1,
    sub: 'Two classic board games. Play a bot or a friend; every game moves your rating.',
    howto: 'Click a piece, then where it goes. Ranks: Rookie, Contender, Veteran, Elite, Master, Grandmaster, Legendary, Unreal. Press <b>F</b> to flip the board.',
    onStart(roster, seed) {
        CC.over = false; CC.res = null; CC.hist = []; CC.last = null; CC.sel = -1; CC.endLine = '';
        document.getElementById('cc-promo').classList.add('hidden');
        if (MG.isHost()) {
            const order = Math.random() < 0.5 ? [0, 1] : [1, 0], ids = [roster[order[0]].id, roster[order[1]].id];
            const sides = CC.mode === 'chess' ? { w: ids[0], b: ids[1] } : { d: ids[0], l: ids[1] };
            const elo = {}; const mine = ccSave()[CC.mode].elo;
            for (const r of roster) elo[r.id] = r.bot ? CC_BOTS[CC.bot].elo : r.id === MG.me ? mine : 0;
            const m = { k: 'start', mode: CC.mode, sides, elo, bot: CC.bot, g: String(seed || Date.now()) };
            MG.toAll(m); ccStart(m);
        }
    },
    onMsg(from, m) {
        if (m.k === 'start') ccStart(m);
        else if (m.k === 'st') ccOnState(m);
        else if (m.k === 'elo') { if (MG.isHost() && m.g === CC.gid) { CC.elo[from] = Math.max(100, Math.min(4000, m.v | 0)); MG.toAll({ k: 'elos', elo: CC.elo, g: CC.gid }); ccDraw(); } }
        else if (m.k === 'elos') { if (m.g === CC.gid) { CC.elo = m.elo; ccDraw(); } }
        else if (m.k === 'mv' && MG.isHost() && m.g === CC.gid) ccHostMove(from, m.id);
        else if (m.k === 'resign' && MG.isHost() && m.g === CC.gid && !CC.over) {
            const side = Object.keys(CC.sides).find(k => CC.sides[k] === from); if (!side) return;
            const win = Object.keys(CC.sides).find(k => k !== side);
            const msg = { k: 'st', st: CC.st, last: CC.last, res: { win, why: ccName(from) + ' resigned' }, g: CC.gid }; MG.toAll(msg); ccOnState(msg);
        }
    },
    onLeave(id) {
        if (!CC.over && MG.isHost() && Object.values(CC.sides).includes(id)) {
            const side = Object.keys(CC.sides).find(k => CC.sides[k] === id), win = Object.keys(CC.sides).find(k => k !== side);
            const msg = { k: 'st', st: CC.st, last: CC.last, res: { win, why: 'Your opponent left' }, g: CC.gid }; MG.toAll(msg); ccOnState(msg);
        }
    },
    onEnd() { setTimeout(() => { const el = document.getElementById('cc-endrate'); if (el && CC.endLine) el.innerHTML = CC.endLine; }, 0); }
});
function ccStart(m) {
    CC.mode = m.mode; CC.sides = m.sides; CC.elo = m.elo || {}; CC.bot = m.bot; CC.gid = m.g;
    CC.over = false; CC.res = null; CC.hist = []; CC.last = null; CC.sel = -1;
    CC.st = ENG().fresh(); CC.moves = ENG().legal(CC.st);
    CC.rated = !!ccMySide();
    const my = ccMySide(); CC.flip = my === 'b' || my === 'l';
    if (my && !MG.isHost()) { CC.elo[MG.me] = ccSave()[CC.mode].elo; MG.toHost({ k: 'elo', v: CC.elo[MG.me], g: CC.gid }); }
    ccMeBox(); ccDraw(); ccBotTurn();
}
ccLobbyExtras();
window.__cc = { CC, CH, CK, CC_BOTS, ccMaterial, ccDraw, ccRank, ccSave, ccRate, state: () => ({ mode: CC.mode, over: CC.over, res: CC.res, turn: CC.st && ccTurnSide(), me: ccMySide(), moves: CC.moves.length, hist: CC.hist.slice() }),
    move: id => ccSend(CC.moves.find(m => ENG().id(m) === id)), ids: () => CC.moves.map(m => ENG().id(m)) };

</script>
