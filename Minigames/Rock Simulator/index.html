<style>
/* Taco Minigames: shared look (copied into every minigame by Minigames/build.sh) */
:root { --mg: #38bdf8; --bg: #0b0f1a; --panel: rgba(17, 24, 39, .92); --line: rgba(255,255,255,.12); --text: #e5e7eb; --dim: #94a3b8; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 60%); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; user-select: none; }
.hidden { display: none !important; }
#mg-lobby, #mg-res { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 8, 16, .72); backdrop-filter: blur(4px); }
.mg-card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; max-width: 640px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.mg-kicker { font: 700 11px ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; color: var(--mg); }
.mg-card h1 { margin: 6px 0 4px; font-size: 40px; font-weight: 900; letter-spacing: .01em; text-shadow: 0 0 24px color-mix(in srgb, var(--mg) 50%, transparent); }
.mg-sub { color: var(--dim); margin: 4px 0 10px; } .mg-how { font-size: 14px; color: #cbd5e1; margin: 8px 0 14px; line-height: 1.5; }
.mg-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 10px 0; }
.mg-btn { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; font: 800 15px system-ui, sans-serif; cursor: pointer; }
.mg-btn:hover { border-color: var(--mg); } .mg-btn.big { background: var(--mg); color: #06101f; border-color: var(--mg); }
.mg-btn:disabled { opacity: .45; cursor: default; }
#mg-code { width: 140px; text-align: center; font: 800 18px system-ui; letter-spacing: .15em; padding: 9px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: #fff; }
#mg-st { min-height: 20px; color: #bae6fd; font-size: 14px; } #mg-st.bad { color: #fda4af; }
.mg-code { font-size: 16px; margin: 8px 0; } .mg-code b { color: var(--mg); font-size: 26px; letter-spacing: .2em; }
#mg-people { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
.mg-chip { background: rgba(255,255,255,.07); border-radius: 999px; padding: 4px 10px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; } .mg-chip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; } .mg-chip small { color: var(--dim); }
select { background: rgba(0,0,0,.4); color: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: 700 14px system-ui; }
label { color: var(--dim); font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.mg-res-row { display: flex; justify-content: space-between; padding: 8px 6px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 17px; } .mg-res-row b { color: var(--mg); }
.mg-hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; font: 800 14px system-ui; pointer-events: none; }
.mg-hud span { background: rgba(0,0,0,.45); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
canvas { display: block; }
.mg-btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 9px; vertical-align: middle; }
#mg-snd { position: fixed; top: 10px; right: 10px; z-index: 70; min-width: 40px; min-height: 36px; font-size: 16px; }
#mg-name { width: 170px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: #fff; font: 700 15px system-ui; user-select: text; }
#mg-ready { color: #bbf7d0; margin: 2px 0 6px; }
#mg-confirm { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 8, 16, .72); }
#mg-confirm .mg-card { max-width: 420px; } #mg-confirm h2 { margin: 4px 0; }

html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
#rk-cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#rk-cv:active { cursor: grabbing; }
#rk-menu { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #3b3f46, #0d0e10 70%); }
#rk-menu.hidden, .rk-hidden { display: none !important; }
.rk-card { width: min(560px, 92vw); text-align: center; color: #e5e7eb; font-family: system-ui, sans-serif; }
.rk-card h1 { font: 900 clamp(40px, 9vw, 76px) system-ui, sans-serif; letter-spacing: .04em; margin: 8px 0 0; color: #d6d3d1; text-shadow: 0 6px 0 #57534e, 0 12px 30px rgba(0,0,0,.6); }
.rk-card .rk-tag { color: #a8a29e; margin: 6px 0 26px; font-size: 16px; }
.rk-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.rk-mode { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; padding: 18px 14px; color: #f5f5f4; cursor: pointer; font: inherit; text-align: left; transition: transform .12s, background .12s; }
.rk-mode:hover { background: rgba(255,255,255,.12); transform: translateY(-2px); }
.rk-mode b { display: block; font-size: 20px; margin-bottom: 6px; } .rk-mode span { color: #a8a29e; font-size: 13px; line-height: 1.4; }
.rk-mode.black { background: #000; border-color: #333; }
.rk-stats { margin-top: 22px; color: #a8a29e; font-size: 13px; line-height: 1.7; }
.rk-stats b { color: #e7e5e4; }
#rk-hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 5; color: rgba(255,255,255,.8); font: 14px system-ui, sans-serif; background: rgba(0,0,0,.45); padding: 8px 14px; border-radius: 10px; transition: opacity 1.2s; pointer-events: none; }
#rk-toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 5; color: #fff; font: 600 18px system-ui, sans-serif; text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity 1.5s; pointer-events: none; text-align: center; }
#rk-time { position: fixed; right: 14px; top: 12px; z-index: 5; color: rgba(255,255,255,.65); font: 600 13px ui-monospace, monospace; text-shadow: 0 1px 3px #000; }
#rk-leave { position: fixed; left: 12px; top: 12px; z-index: 6; background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 7px 12px; font: 600 13px system-ui, sans-serif; cursor: pointer; transition: opacity .8s; }
body.rk-black #rk-cv { visibility: hidden; } body.rk-black { cursor: none; }
body.rk-quiet #rk-leave, body.rk-quiet #rk-hint { opacity: 0; pointer-events: none; }

</style>

<div id="app"></div>
<script type="module">
// ---- 00-mg.js ----
// ==========================================
// TACO MINIGAMES: the shared lobby (copied into every minigame by Minigames/build.sh; edit it here).
// Play vs bots right away, or open a room (6-digit code, HGNet = the launcher's multiplayer network) and friends
// join; the host adds bots to fill seats and starts. The host runs the game (and the bots) and tells everyone.
// A game calls MG.init({...}) and gets onStart(roster, seed), onMsg(peerId, msg), onLeave(id) back.
// ==========================================
const MG = { cfg: null, net: null, host: false, solo: false, code: '', me: 0, name: '', roster: [], started: false, bots: 1, adT: 0 };
const MG_BOTS = ['Byte', 'Pixel', 'Turbo', 'Glitch', 'Echo', 'Nova', 'Bolt', 'Rusty', 'Sprocket', 'Zippy'];
const MG_COLS = ['#38bdf8', '#f472b6', '#facc15', '#4ade80', '#a78bfa', '#fb923c', '#f87171', '#2dd4bf', '#e879f9', '#fde68a'];
function mgEl(id) { return document.getElementById(id); }
function mgEsc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function mgCol(i) { return MG_COLS[i % MG_COLS.length]; }
function mgHG() {
    const h = window.HGNet || (() => { try { return window.parent && window.parent.HGNet; } catch (e) { return null; } })();
    if (h) return Promise.resolve(h);
    return new Promise(res => { const s = document.createElement('script'); s.src = '../../gv/vendor/hgnet.js'; s.onload = () => res(window.HGNet || null); s.onerror = () => res(null); document.head.appendChild(s); });
}
function mgLauncherName() { try { const L = window.parent && window.parent.HGGrapevine, me = L && L.me(); if (me) return me.name; } catch (e) {} return ''; }
function mgMyName() {
    const ln = mgLauncherName(); if (ln) return ln;
    try { let n = localStorage.getItem('hgmini_name'); if (!n) { n = 'Player ' + (100 + Math.floor(Math.random() * 900)); localStorage.setItem('hgmini_name', n); } return n; } catch (e) { return 'Player'; }
}
function mgLs(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function mgSay(t, bad) { const e = mgEl('mg-st'); if (e) { e.textContent = t; e.className = bad ? 'bad' : ''; } }
// ---- the lobby screen
MG.init = function (cfg) {
    MG.cfg = Object.assign({ min: 2, max: 8, bots: 7, defBots: 1, color: '#38bdf8', solo: true }, cfg);
    document.documentElement.style.setProperty('--mg', MG.cfg.color);
    const d = document.createElement('div'); d.id = 'mg-lobby';
    d.innerHTML = `<div class="mg-card"><div class="mg-kicker">Taco Minigames</div><h1>${mgEsc(cfg.title)}</h1><p class="mg-sub">${cfg.sub || ''}</p>
      <div class="mg-how">${cfg.howto || ''}</div>
      <div class="mg-row">${MG.cfg.solo ? '<button class="mg-btn big" id="mg-solo">Play vs bots</button>' : ''}<button class="mg-btn" id="mg-host">Open a room</button>
        <input id="mg-code" maxlength="7" inputmode="numeric" placeholder="6-digit code" autocomplete="off"><button class="mg-btn" id="mg-join">Join</button></div>
      <div class="mg-row hidden" id="mg-namerow"><label>Your name <input id="mg-name" maxlength="16" autocomplete="off"></label></div>
      <div id="mg-st"></div>
      <div id="mg-room" class="hidden"><div class="mg-code">Room code <b id="mg-codev"></b> <button class="mg-btn sm" id="mg-copy" title="Copy the room code">Copy</button></div><div id="mg-people"></div>
        <div class="mg-row" id="mg-hostrow"><label>Bots <select id="mg-bots"></select></label><button class="mg-btn big" id="mg-start" title="Start (Enter)">Start</button></div>
        <div id="mg-ready" class="mg-sub hidden"></div>
        <div id="mg-wait" class="mg-sub hidden">Waiting for the host to start...</div></div></div>`;
    document.body.appendChild(d);
    const r = document.createElement('div'); r.id = 'mg-res'; r.className = 'hidden'; document.body.appendChild(r);
    const sel = mgEl('mg-bots'); for (let i = 0; i <= MG.cfg.bots; i++) sel.add(new Option(String(i), i)); sel.value = MG.cfg.defBots;
    const bk = 'hgmini_bots_' + MG.cfg.id, sb = parseInt(mgLs(bk), 10);     // the bot count you picked last time
    sel.onchange = () => { MG.bots = +sel.value; mgLs(bk, String(MG.bots)); mgLobbySend(); };
    MG.bots = sb >= 0 && sb <= MG.cfg.bots ? sb : MG.cfg.defBots; sel.value = MG.bots;
    if (!mgLauncherName()) {     // not signed in to the launcher: the name can be changed here and is remembered
        const ni = mgEl('mg-name'); mgEl('mg-namerow').classList.remove('hidden'); ni.value = mgMyName();
        ni.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') ni.blur(); };
        ni.onchange = () => { const v = ni.value.replace(/\s+/g, ' ').trim().slice(0, 16); if (v) mgLs('hgmini_name', v); ni.value = mgMyName(); };
    }
    mgEl('mg-copy').onclick = () => mgCopyCode();
    mgQolInit();
    if (mgEl('mg-solo')) mgEl('mg-solo').onclick = () => mgSolo();
    mgEl('mg-host').onclick = () => mgHost();
    mgEl('mg-join').onclick = () => mgJoin(mgEl('mg-code').value);
    mgEl('mg-code').onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') mgJoin(mgEl('mg-code').value); };
    mgEl('mg-start').onclick = () => mgStart();
    // the launcher: invites, open parties, Quick Match
    window.__hgJoin = c => { mgShowLobby(); mgEl('mg-code').value = c; mgJoin(c); return true; };
    window.__hgHost = convId => { mgShowLobby(); mgHost(); const iv = setInterval(() => { if (MG.code) { clearInterval(iv); try { window.parent.HG_sendInvite(convId, { game: MG.cfg.id, code: MG.code, max: MG.cfg.max }); } catch (e) {} } }, 300); setTimeout(() => clearInterval(iv), 25000); };
    setTimeout(() => { try { const p = window.parent; if (!p || p === window) return; const c = p.HG_takeJoin && p.HG_takeJoin(MG.cfg.id); if (c) return window.__hgJoin(c); const h = p.HG_takeHost && p.HG_takeHost(MG.cfg.id); if (h && h.convId) window.__hgHost(h.convId); } catch (e) {} }, 400);
    window.__mg = MG;
};
function mgShowLobby() { mgEl('mg-lobby').classList.remove('hidden'); mgEl('mg-res').classList.add('hidden'); }
function mgHideLobby() { mgEl('mg-lobby').classList.add('hidden'); mgEl('mg-res').classList.add('hidden'); }
function mgBotsFor(nHumans, n) { const out = []; for (let i = 0; i < Math.min(n, MG.cfg.max - nHumans); i++) out.push({ id: 100 + i, name: MG_BOTS[i % MG_BOTS.length] + ' (bot)', bot: true }); return out; }
function mgHumans() {
    const out = [{ id: 0, name: MG.host ? MG.name : ((MG.roster.find(r => r.id === 0) || {}).name || 'Host') }];
    if (MG.net && MG.host) for (const p of MG.net.peers()) if (!p.isHost && p.state !== 'left') out.push({ id: p.id, name: String(p.name || 'Player').slice(0, 16) });
    return out;
}

    const trunkM = new THREE.MeshLambertMaterial({ color: 0x6b4a2f }), pineM = new THREE.MeshLambertMaterial({ color: 0x2f5d34, flatShading: true }), oakM = new THREE.MeshLambertMaterial({ color: 0x4f8a3a, flatShading: true });
    for (let i = 0; i < 70; i++) {
        const r = rnd(14, 120), a = rnd(0, 6.283), x = Math.cos(a) * r, z = Math.sin(a) * r; if (Math.hypot(x - pondC.x, z - pondC.y) < 12) continue;
        const t = new THREE.Group(), s = rnd(.8, 1.6), y = groundY(x, z);
        const tr = new THREE.Mesh(new THREE.CylinderGeometry(.18 * s, .28 * s, 2.4 * s, 7), trunkM); tr.position.y = 1.2 * s; tr.castShadow = true; t.add(tr);
        if (i % 3) { for (let k = 0; k < 3; k++) { const cn = new THREE.Mesh(new THREE.ConeGeometry((2 - k * .5) * s, 2.6 * s, 8), pineM); cn.position.y = (2.4 + k * 1.3) * s; cn.castShadow = true; t.add(cn); } }
        else { const b = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2 * s, 1), oakM); b.position.y = 3.6 * s; b.castShadow = true; t.add(b); }
        t.position.set(x, y, z); t.rotation.y = rnd(0, 6.283); S.add(t);
    }
    // other rocks (friends)
    const rockM = new THREE.MeshStandardMaterial({ color: 0x8d8a85, roughness: .95, flatShading: true });
    const rockGeo = (rad, det) => { const g = new THREE.IcosahedronGeometry(rad, det), a = g.attributes.position; for (let i = 0; i < a.count; i++) { const v = new THREE.Vector3().fromBufferAttribute(a, i); v.multiplyScalar(1 + Math.sin(v.x * 9.1) * .08 + Math.cos(v.z * 7.3 + v.y * 5) * .08); v.y *= .7; a.setXYZ(i, v.x, v.y, v.z); } g.computeVertexNormals(); return g; };
    for (let i = 0; i < 26; i++) { const r = rnd(1.5, 26), a = rnd(0, 6.283), x = Math.cos(a) * r, z = Math.sin(a) * r, s = rnd(.15, .9); const k = new THREE.Mesh(rockGeo(s, 1), rockM); k.position.set(x, groundY(x, z) + s * .25, z); k.rotation.set(rnd(0, 1), rnd(0, 6), 0); k.castShadow = k.receiveShadow = true; S.add(k); }
    // you: the top of your own rock, there when you look down
    const me = new THREE.Mesh(rockGeo(.42, 2), new THREE.MeshStandardMaterial({ color: 0x9b958c, roughness: 1, flatShading: true })); me.position.set(0, -.08, .05); me.receiveShadow = true; S.add(me);
    // mountains far away
    const mtM = new THREE.MeshLambertMaterial({ color: 0x7d93a8, flatShading: true });
    for (let i = 0; i < 18; i++) { const a = i / 18 * 6.283 + rnd(-.1, .1), r = rnd(230, 290), h = rnd(30, 70); const mt = new THREE.Mesh(new THREE.ConeGeometry(rnd(40, 70), h, 6), mtM); mt.position.set(Math.cos(a) * r, h / 2 - 4, Math.sin(a) * r); S.add(mt); }
    // clouds: soft blobs, standing still (it is a very calm day)
    const cM = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x9aa7b5, flatShading: true, fog: false });
    for (let i = 0; i < 14; i++) { const g = new THREE.Group(), a = rnd(0, 6.283), r = rnd(120, 260); for (let k = 0; k < 5; k++) { const b = new THREE.Mesh(new THREE.IcosahedronGeometry(rnd(6, 11), 1), cM); b.position.set(k * 9 - 18, rnd(-2, 3), rnd(-4, 4)); b.scale.y = .55; g.add(b); } g.position.set(Math.cos(a) * r, rnd(55, 90), Math.sin(a) * r); g.lookAt(0, g.position.y, 0); S.add(g); }
    addEventListener('resize', fit); fit();
}
function fit() { if (!RK.renderer) return; RK.renderer.setSize(innerWidth, innerHeight, false); RK.cam.aspect = innerWidth / innerHeight; RK.cam.updateProjectionMatrix(); }

// ---- being a rock ----
function hint(t, ms) { const h = $('rk-hint'); h.textContent = t; h.classList.remove('rk-hidden'); h.style.opacity = 1; clearTimeout(RK.ht); RK.ht = setTimeout(() => { h.style.opacity = 0; }, ms || 3500); }
function toast(t) { const e = $('rk-toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(RK.tt); RK.tt = setTimeout(() => { e.style.opacity = 0; }, 4500); }
function wake() { document.body.classList.remove('rk-quiet'); RK.quietT = performance.now(); }
function start(mode) {
    RK.mode = mode; RK.t0 = performance.now(); RK.last = RK.t0; RK.shown = {}; RK.saved = 0;
    $('rk-menu').classList.add('hidden'); $('rk-leave').classList.remove('rk-hidden');
    document.body.classList.toggle('rk-black', mode === 'real');
    $('rk-time').classList.toggle('rk-hidden', mode === 'real');
    if (mode === 'reg') { if (!RK.renderer) build(); RK.yaw = -0.4; RK.pitch = .05; hint('Drag (or use the arrow keys) to look around. You cannot move. You are a rock.', 5000); }
    else hint('You are a rock. Press Esc (or move the mouse and press the button) to stop.', 3500);
    wake();
}
function leave() {
    if (!RK.mode) return;
    const sec = (performance.now() - RK.t0) / 1000, s = rkSave();
    s.total += sec; s.best = Math.max(s.best, sec); s.sessions++; s[RK.mode] = (s[RK.mode] || 0) + sec; rkWrite(s);
    RK.mode = ''; document.body.classList.remove('rk-black'); $('rk-menu').classList.remove('hidden'); $('rk-leave').classList.add('rk-hidden'); $('rk-time').classList.add('rk-hidden'); $('rk-hint').classList.add('rk-hidden');
    $('rk-toast').style.opacity = 0; paintStats();
}
addEventListener('pagehide', leave);      // closing the game from the launcher still counts your time
$('rk-reg').onclick = () => start('reg'); $('rk-real').onclick = () => start('real'); $('rk-leave').onclick = leave;
addEventListener('keydown', e => {
    if (!RK.mode) return; wake();
    if (e.key === 'Escape') { leave(); return; }
    RK.keys[e.key] = true;
    if (/^[wasdWASD ]$/.test(e.key) && performance.now() - RK.saidMove > 4000) { RK.saidMove = performance.now(); hint(['Rocks do not move.', 'You try to move. You are a rock. Nothing happens.', 'Still a rock.', 'Rocks cannot jump either.'][Math.floor(Math.random() * 4)], 2500); }
});
addEventListener('keyup', e => { RK.keys[e.key] = false; });
const cv = $('rk-cv');
cv.addEventListener('pointerdown', e => { if (RK.mode !== 'reg') return; RK.drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (!RK.drag) return; RK.yaw += (e.clientX - RK.drag.x) * .004; RK.pitch = Math.max(-1.35, Math.min(1.35, RK.pitch + (e.clientY - RK.drag.y) * .004)); RK.drag = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', () => { RK.drag = null; });
addEventListener('pointermove', () => { if (RK.mode) wake(); });

function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(.05, (now - (RK.last || now)) / 1000); RK.last = now;
    if (!RK.mode) return;
    const sec = (now - RK.t0) / 1000;
    if (now - RK.quietT > 4000) document.body.classList.add('rk-quiet');
    for (const [t, msg] of MILESTONES) if (sec >= t && !RK.shown[t]) { RK.shown[t] = 1; if (RK.mode === 'reg') toast(msg); }
    if (RK.mode !== 'reg') return;
    $('rk-time').textContent = 'a rock for ' + fmt(sec);
    const k = RK.keys, sp = 1.4 * dt;
    if (k.ArrowLeft) RK.yaw -= sp; if (k.ArrowRight) RK.yaw += sp; if (k.ArrowUp) RK.pitch = Math.min(1.35, RK.pitch + sp); if (k.ArrowDown) RK.pitch = Math.max(-1.35, RK.pitch - sp);
    RK.cam.rotation.set(0, 0, 0); RK.cam.rotation.order = 'YXZ'; RK.cam.rotation.y = -RK.yaw; RK.cam.rotation.x = RK.pitch;
    RK.renderer.render(RK.scene, RK.cam);
}
requestAnimationFrame(loop);
// tests
RK.start = start; RK.leave = leave; RK.save = rkSave;

</script>
</body>
