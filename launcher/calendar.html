<section id="view-cal" aria-labelledby="cal-heading" hidden>
  <header class="cal-head">
    <div>
      <h2 id="cal-heading">Calendar</h2>
      <div class="cal-account">
        <span id="cal-sync" role="status">Saved on this device</span>
        <button class="cal-link" id="cal-signin" type="button">Sign in to sync</button>
        <button class="cal-link" id="cal-import" type="button" hidden>Import local events</button>
      </div>
    </div>
    <button class="cal-button cal-primary" id="cal-add" type="button">Add event</button>
  </header>
  <div id="cal-message" role="status"></div>
  <div class="cal-layout">
    <section class="cal-panel" aria-labelledby="cal-month">
      <header class="cal-toolbar">
        <h3 id="cal-month" aria-live="polite"></h3>
        <div class="cal-actions">
          <button class="cal-button" id="cal-prev" type="button" aria-label="Previous month">&#8249;</button>
          <button class="cal-button" id="cal-today" type="button">Today</button>
          <button class="cal-button" id="cal-next" type="button" aria-label="Next month">&#8250;</button>
        </div>
      </header>
      <div class="cal-week" aria-hidden="true">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div id="cal-grid"></div>
    </section>
    <section class="cal-panel cal-agenda" aria-labelledby="cal-day">
      <header class="cal-toolbar">
        <h3 id="cal-day" aria-live="polite"></h3>
      </header>
      <div id="cal-events"></div>
    </section>
  </div>
  <dialog id="cal-dialog" aria-labelledby="cal-dialog-heading">
    <form id="cal-form">
      <h3 id="cal-dialog-heading">Add event</h3>
      <label>Title <input id="cal-title" required maxlength="120" autofocus></label>
      <div class="cal-fields">
        <label>Date <input id="cal-date" type="date" required min="0001-01-01" max="9999-12-31"></label>
        <label>Time <input id="cal-time" type="time" aria-describedby="cal-time-help"></label>
      </div>
      <p class="cal-note" id="cal-time-help">Leave time blank for an all-day event.</p>
      <label>Category
        <select id="cal-type" required>
          <option value="Homework">Homework</option>
          <option value="Meeting">Meeting</option>
          <option value="DueDate">Due Date</option>
          <option value="Holiday">Holiday</option>
          <option value="Birthday">Birthday</option>
        </select>
      </label>
      <p id="cal-error" role="alert"></p>
      <div class="cal-dialog-actions">
        <button class="cal-button cal-delete" id="cal-delete" type="button" hidden>Delete</button>
        <button class="cal-button" id="cal-cancel" type="button">Cancel</button>
        <button class="cal-button cal-primary" type="submit">Save event</button>
      </div>
    </form>
  </dialog>
</section>
