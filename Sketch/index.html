.sk-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #2b2b2b; } .sk-btn.alt { background: #bfdbfe; } .sk-btn:disabled { opacity: .45; cursor: default; }
.sk-miss { text-align: left; font-size: 14px; margin: 10px 0; background: #fef9c3; border: 2px dashed #a16207; border-radius: 10px; padding: 8px 12px; }
.sk-miss div { margin: 3px 0; } .sk-miss .done { text-decoration: line-through; color: #15803d; }
.sk-skins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.sk-skin { border: 2px solid #2b2b2b; border-radius: 12px; padding: 6px; background: #fff; cursor: pointer; font: inherit; font-size: 13px; }
.sk-skin.on { background: #bbf7d0; } .sk-skin canvas { display: block; margin: 0 auto 2px; }
.sk-hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; color: #222; text-shadow: 2px 2px 0 #fff; display: flex; gap: 18px; }
.sk-hud small { font-size: 15px; color: #555; }

<script type="module">
// ---- 10-sketch.js ----
// ==========================================
// SKETCH: a doodle that only goes up. Bounce from platform to platform on a page of notebook paper.
//   ←/→ (or A/D, or hold the left / right half of the screen) to steer; the sides wrap around. SPACE / ↑ / W shoots.
//   Platforms: plain, sliding, cracked (break under you), vanishing (one bounce), springs and trampolines.
//   Power-ups: propeller cap, rocket, spring shoes (5 big bounces), bubble shield. Monsters: stomp them or shoot them.
//   Black holes: stay away. Pencil coins buy new doodles and paper; three missions at a time pay coins too.
// World units: a 400-wide page; y grows downward, the doodle climbs to negative y. Height = -y / 10.
// Save (synced, prefix taco): taco.sketch.v1 = { best, coins, skins, skin, paper, papers, runs, missions, stats }
// ==========================================
const W = 400, VIEW = 680, G = 1500, JUMP = 830, SPRING = 1320, TRAMP = 1800;
const cv = document.getElementById('cv'), ui = document.getElementById('ui');
let g = cv.getContext('2d');
const SAVE_KEY = 'taco.sketch.v1';
const SKINS = [
    { id: 'classic', n: 'Scribble', c: '#fde68a', c2: '#f59e0b', cost: 0 }, { id: 'ocean', n: 'Fishy', c: '#7dd3fc', c2: '#0284c7', cost: 60 },
    { id: 'lava', n: 'Ember', c: '#fca5a5', c2: '#dc2626', cost: 120 }, { id: 'ghost', n: 'Boo', c: '#f1f5f9', c2: '#94a3b8', cost: 180 },
    { id: 'ninja', n: 'Ninja', c: '#4b5563', c2: '#111827', cost: 250, band: '#ef4444' }, { id: 'mint', n: 'Minty', c: '#a7f3d0', c2: '#10b981', cost: 90 }, { id: 'gold', n: 'Golden', c: '#fde047', c2: '#ca8a04', cost: 500, crown: 1 }];
const PAPERS = [{ id: 'note', n: 'Notebook', cost: 0 }, { id: 'grid', n: 'Graph paper', cost: 100 }, { id: 'sticky', n: 'Sticky note', cost: 150 }, { id: 'night', n: 'Blueprint', cost: 300 }];
const MISSIONS = [
    { id: 'h1', t: 'Reach a height of 1,000', k: 'height', n: 1000, pay: 15 }, { id: 'h3', t: 'Reach 3,000', k: 'height', n: 3000, pay: 35 }, { id: 'h6', t: 'Reach 6,000', k: 'height', n: 6000, pay: 70 },
    { id: 'sp', t: 'Bounce on 5 springs in one run', k: 'springs', n: 5, pay: 20 }, { id: 'tr', t: 'Use 2 trampolines in one run', k: 'tramps', n: 2, pay: 25 },
    { id: 'mo', t: 'Stomp 2 monsters in one run', k: 'stomps', n: 2, pay: 30 }, { id: 'sh', t: 'Shoot 3 monsters in one run', k: 'shots', n: 3, pay: 30 },
    { id: 'co', t: 'Collect 25 coins in one run', k: 'coins', n: 25, pay: 25 }, { id: 'ro', t: 'Ride a rocket', k: 'rockets', n: 1, pay: 15 },
    { id: 'pr', t: 'Fly with 2 propeller caps in one run', k: 'props', n: 2, pay: 25 }, { id: 'br', t: 'Break 6 cracked platforms in one run', k: 'breaks', n: 6, pay: 20 },
    { id: 'h10', t: 'Reach 10,000', k: 'height', n: 10000, pay: 120 }];
function load() {
    let s = null; try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {}
    s = Object.assign({ best: 0, coins: 0, skins: ['classic'], skin: 'classic', papers: ['note'], paper: 'note', runs: 0, missions: [], doneM: [], stats: { height: 0, stomps: 0, shots: 0, coins: 0 } }, s && typeof s === 'object' ? s : {});
    while (s.missions.length < 3) { const m = MISSIONS.find(x => !s.missions.includes(x.id) && !s.doneM.includes(x.id)) || MISSIONS.find(x => !s.missions.includes(x.id)); if (!m) break; s.missions.push(m.id); }
    return s;
}
let SV = load();
const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SV)); } catch (e) {} };
// ---- sound: small blips from Web Audio ----
let AC = null;
function tone(f, len, type, vol, f2) {
    try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); const o = AC.createOscillator(), v = AC.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(f, AC.currentTime); if (f2) o.frequency.exponentialRampToValueAtTime(f2, AC.currentTime + len); v.gain.setValueAtTime(vol || .05, AC.currentTime); v.gain.exponentialRampToValueAtTime(.0008, AC.currentTime + len); o.connect(v); v.connect(AC.destination); o.start(); o.stop(AC.currentTime + len); } catch (e) {}
}
const SND = { jump: () => tone(420, .12, 'triangle', .05, 820), spring: () => tone(300, .3, 'sine', .07, 1300), tramp: () => tone(200, .45, 'sine', .08, 1600), breakP: () => tone(160, .15, 'sawtooth', .04, 60),
    coin: () => tone(1200, .08, 'square', .03, 1800), shoot: () => tone(900, .06, 'square', .03, 500), stomp: () => tone(220, .2, 'square', .06, 80), die: () => tone(500, .8, 'sawtooth', .06, 60), power: () => tone(500, .5, 'triangle', .06, 1500) };

// ---- the run ----
const S = { on: false, over: false, paused: false, p: null, plats: [], mons: [], holes: [], items: [], coinsL: [], bullets: [], parts: [], cam: 0, top: 0, maxH: 0, t: 0, run: null, keys: {}, touch: 0, rng: 1 };
window.__sketch = S;
function rnd(a, b) { return a + Math.random() * (b - a); }
function wob(n) { return Array.from({ length: n }, () => rnd(-1.6, 1.6)); }
function newRun() {
    Object.assign(S, { on: true, over: false, paused: false, plats: [], mons: [], holes: [], items: [], coinsL: [], bullets: [], parts: [], cam: 0, maxH: 0, t: 0 });
    S.p = { x: W / 2, y: -60, vx: 0, vy: -JUMP, face: 1, power: null, pt: 0, shoes: 0, shield: 0, squash: 0, shootT: 0, dead: 0 };
    S.run = { height: 0, springs: 0, tramps: 0, stomps: 0, shots: 0, coins: 0, rockets: 0, props: 0, breaks: 0 };
    S.plats.push(mkPlat(W / 2 - 34, 0, 'n'));
    S.top = 0; while (S.top > S.cam - VIEW * 2) genRow();
    showHUD();
}
function mkPlat(x, y, k) { return { x, y, w: k === 'tramp' ? 76 : 68, k, vx: k === 'm' ? rnd(50, 110) * (Math.random() < .5 ? -1 : 1) : 0, gone: 0, wob: wob(6), spring: 0, hit: 0 }; }
// rows of platforms above the highest one: the gap grows with height, but a jumpable platform always comes in reach
function genRow() {
    const h = -S.top / 10, diff = Math.min(1, h / 8000);
    const gap = rnd(48, 80 + diff * 105);
    S.top -= gap;
    const x = rnd(4, W - 72), r = Math.random();
    let k = 'n';
    if (h > 300 && r < .12 + diff * .2) k = 'm';
    else if (h > 1500 && r < .2 + diff * .2) k = 'v';
    const pl = mkPlat(x, S.top, k); S.plats.push(pl);
    const r2 = Math.random();
    if (k !== 'v') {
        if (r2 < .07) pl.spring = 1;
        else if (r2 < .085 && h > 600) pl.k = 'tramp', pl.w = 76;
        else if (r2 < .13) S.coinsL.push({ x: pl.x + pl.w / 2, y: pl.y - 26, got: 0 });
        else if (r2 < .145 + diff * .01 && h > 400) S.items.push({ x: pl.x + pl.w / 2, y: pl.y - 22, k: ['prop', 'rocket', 'shoes', 'shield'][Math.floor(Math.random() * 4)], pl });
    }
    // extras: cracked decoys (they break, they do not hold you), coin strings, monsters and black holes
    if (Math.random() < .22 + diff * .25) S.plats.push(mkPlat(rnd(4, W - 72), S.top - rnd(10, gap * .6), 'b'));
    if (Math.random() < .05) for (let k2 = 0; k2 < 4; k2++) S.coinsL.push({ x: rnd(30, W - 30), y: S.top - k2 * 26 - 40, got: 0 });
    if (h > 900 && Math.random() < .035 + diff * .05) S.mons.push({ x: rnd(40, W - 40), y: S.top - rnd(60, 120), k: Math.floor(Math.random() * 3), vx: rnd(40, 80) * (Math.random() < .5 ? -1 : 1), t: rnd(0, 6), hp: 1 + (Math.random() < diff * .5 ? 1 : 0), dead: 0 });
    if (h > 2500 && Math.random() < .012 + diff * .02) S.holes.push({ x: rnd(50, W - 50), y: S.top - 90 });
}
function step(dt) {
    if (!S.on || S.paused) return;
    const p = S.p, run = S.run; S.t += dt;
    // steering
    const k = S.keys, dir = (k.ArrowRight || k.KeyD || S.touch > 0 ? 1 : 0) - (k.ArrowLeft || k.KeyA || S.touch < 0 ? 1 : 0);
    p.vx += dir * 2600 * dt; p.vx *= Math.pow(dir ? .9 : .004, dt); p.vx = Math.max(-420, Math.min(420, p.vx)); if (dir) p.face = dir;
    if (p.dead) { p.vy += G * dt; p.y += p.vy * dt; p.x += p.vx * dt * .3; if (p.y > S.cam + VIEW + 200) end(); return; }
    // power-ups that fly you
    if (p.power === 'prop' || p.power === 'rocket') {
        p.pt -= dt; p.vy = p.power === 'rocket' ? -1350 : -720;
        if (Math.random() < .5) S.parts.push({ x: p.x + rnd(-6, 6), y: p.y + 20, vx: rnd(-40, 40), vy: rnd(60, 160), t: .5, c: p.power === 'rocket' ? '#f97316' : '#94a3b8' });
        if (p.pt <= 0) { p.power = null; p.vy = -400; }
    } else p.vy += G * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.x < -20) p.x += W + 40; if (p.x > W + 20) p.x -= W + 40;
    p.shield = Math.max(0, p.shield - dt); p.squash = Math.max(0, p.squash - dt * 4); p.shootT -= dt;
    if ((k.Space || k.ArrowUp || k.KeyW) && p.shootT <= 0) shoot();

    if (p.vy > 0 && !p.power) for (const pl of S.plats) {
        if (pl.gone) continue;
        const feet = p.y + 22, prev = feet - p.vy * dt;
        if (prev <= pl.y + 2 && feet >= pl.y && p.x + 14 > pl.x && p.x - 14 < pl.x + pl.w) {
            if (pl.k === 'b') { pl.gone = 1; pl.fall = 0; run.breaks++; SND.breakP(); continue; }
            p.y = pl.y - 22; p.squash = 1;
            let v = JUMP;
            if (pl.spring && p.x > pl.x + pl.w / 2 - 18 && p.x < pl.x + pl.w / 2 + 18) { v = SPRING; pl.spring = 2; run.springs++; SND.spring(); }
            else if (pl.k === 'tramp') { v = TRAMP; run.tramps++; pl.hit = .4; SND.tramp(); for (let i = 0; i < 8; i++) S.parts.push({ x: p.x, y: p.y + 20, vx: rnd(-140, 140), vy: rnd(-60, 60), t: .5, c: '#22c55e' }); }
            else if (p.shoes > 0) { v = SPRING * .95; p.shoes--; SND.spring(); } else SND.jump();
            p.vy = -v;
            if (pl.k === 'v') pl.gone = 1;
            break;
        }
    }
