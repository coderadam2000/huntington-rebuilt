<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Design Anything</title>
<style>
:root { --bg: #f4f2fb; --panel: #ffffff; --line: #e4e0f2; --ink: #2a2440; --dim: #8a83a6; --acc: #7c3aed; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; }
body { display: grid; grid-template-columns: 300px 1fr 250px; grid-template-rows: 50px 1fr; }
#top { grid-column: 1 / 4; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: linear-gradient(90deg, #7c3aed, #db2777); color: #fff; }
#top h1 { font-size: 18px; margin: 0 14px 0 0; letter-spacing: .02em; } #top input { background: rgba(255,255,255,.18); border: 0; color: #fff; padding: 6px 10px; border-radius: 8px; font: inherit; width: 200px; }
#top .sp { flex: 1; }
.tb { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 8px; padding: 7px 11px; font: 600 13px inherit; cursor: pointer; } .tb:hover { background: rgba(255,255,255,.3); } .tb:disabled { opacity: .4; }
.tb.main { background: #fff; color: var(--acc); }
#side { display: flex; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }
#tabs { width: 64px; background: #faf9ff; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#tabs button { border: 0; background: none; padding: 10px 2px; font: 11px inherit; color: var(--dim); cursor: pointer; } #tabs button b { display: block; font-size: 20px; } #tabs button.on { color: var(--acc); background: #f1ebff; }
#lib { flex: 1; overflow-y: auto; padding: 10px; }
#lib h3 { margin: 10px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
#lib input[type=search] { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; } .grid.g4 { grid-template-columns: repeat(4, 1fr); gap: 4px; } .grid.g3 { grid-template-columns: repeat(3, 1fr); }
.tile { border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; padding: 6px; text-align: center; font-size: 11px; color: var(--ink); } .tile:hover { border-color: var(--acc); box-shadow: 0 2px 8px rgba(124,58,237,.18); }
.tile canvas { width: 100%; border-radius: 6px; display: block; margin-bottom: 4px; background: #eee; }
.emo { font-size: 26px; border: 0; background: none; cursor: pointer; padding: 4px; border-radius: 8px; } .emo:hover { background: #f1ebff; }
.sw { width: 100%; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
#stage { position: relative; overflow: hidden; background: repeating-conic-gradient(#ebe8f5 0 25%, #f4f2fb 0 50%) 0 0 / 24px 24px; }
#cv, #ov { position: absolute; left: 0; top: 0; } #cv { box-shadow: 0 10px 40px rgba(42,36,64,.25); } #ov { cursor: default; }
#edit { position: absolute; z-index: 5; border: 2px dashed var(--acc); background: rgba(255,255,255,.9); resize: none; font: inherit; padding: 4px; }
#props { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px; }
#props h3 { margin: 4px 0 10px; font-size: 13px; } #props label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 7px 0; color: var(--dim); }
#props input[type=range] { width: 120px; } #props input[type=color] { width: 44px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; }
#props select, #props input[type=number], #props input[type=text] { width: 130px; padding: 5px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
.row { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; } .pb { flex: 1; border: 1px solid var(--line); background: #faf9ff; border-radius: 8px; padding: 7px 4px; cursor: pointer; font: inherit; color: var(--ink); min-width: 60px; } .pb:hover { border-color: var(--acc); } .pb.on { background: var(--acc); color: #fff; }
#modal { position: fixed; inset: 0; background: rgba(42,36,64,.55); z-index: 20; display: flex; align-items: center; justify-content: center; } #modal .box { background: #fff; border-radius: 16px; padding: 20px; width: min(760px, 92vw); max-height: 86vh; overflow: auto; }
.hidden { display: none !important; }

/* the 3D studio sits over the 2D editor (which stays one click away) */
#s3 { position: fixed; inset: 0; z-index: 30; display: grid; grid-template-columns: 236px 1fr 320px; grid-template-rows: 52px 1fr; background: #0f0d1a; color: #ece9fb; font: 13px system-ui, -apple-system, 'Segoe UI', sans-serif; }
#s3.hidden { display: none; }
#s3 .t3 { grid-column: 1 / 4; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: linear-gradient(90deg, #4c1d95, #be185d); }
#s3 .t3 h1 { font-size: 18px; margin: 0 12px 0 0; } #s3 .t3 .sp { flex: 1; }
#s3 .t3 input { background: rgba(255,255,255,.16); border: 0; color: #fff; padding: 6px 10px; border-radius: 8px; font: inherit; width: 170px; }
#s3 button.b3 { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 8px; padding: 7px 10px; font: 600 12.5px inherit; cursor: pointer; white-space: nowrap; } #s3 button.b3:hover { background: rgba(255,255,255,.28); } #s3 button.b3.on { background: #fff; color: #6d28d9; } #s3 button.b3:disabled { opacity: .4; }
#s3 .cat { overflow-y: auto; padding: 10px; background: #15122a; border-right: 1px solid #2a2547; }
#s3 .cat h3, #s3 .opt h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #9d96c7; margin: 10px 0 6px; }
#s3 .objs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
#s3 .obj { background: #1f1a3a; border: 1px solid #2f2856; border-radius: 12px; padding: 10px 4px; text-align: center; cursor: pointer; color: #ece9fb; font: 12px inherit; } #s3 .obj b { display: block; font-size: 26px; margin-bottom: 2px; } #s3 .obj.on { border-color: #f472b6; background: #3b1d5a; } #s3 .obj:hover { border-color: #a78bfa; }
#s3 .view { position: relative; overflow: hidden; background: #000; } #s3 .view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; } #s3 .view canvas:active { cursor: grabbing; }
#s3 .vbar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; background: rgba(15,13,26,.75); padding: 6px; border-radius: 12px; backdrop-filter: blur(6px); }
#s3 .vbar select { background: #241f42; color: #fff; border: 1px solid #3b3463; border-radius: 8px; padding: 6px; font: inherit; }
#s3 .hint { position: absolute; left: 12px; top: 10px; color: rgba(255,255,255,.55); font-size: 12px; pointer-events: none; }
#s3 .opt { overflow-y: auto; padding: 4px 12px 30px; background: #15122a; border-left: 1px solid #2a2547; }
#s3 details { border-bottom: 1px solid #2a2547; padding: 4px 0; } #s3 summary { cursor: pointer; font-weight: 700; padding: 8px 0; color: #f5d0fe; list-style: none; } #s3 summary::before { content: '▸ '; color: #a78bfa; } #s3 details[open] summary::before { content: '▾ '; }
#s3 label.r { display: grid; grid-template-columns: 112px 1fr 44px; align-items: center; gap: 6px; margin: 6px 0; color: #c9c3ea; } #s3 label.r output { text-align: right; color: #f5d0fe; font-variant-numeric: tabular-nums; }
#s3 label.r input[type=range] { width: 100%; accent-color: #f472b6; } #s3 label.r input[type=color] { width: 100%; height: 26px; border: 1px solid #3b3463; border-radius: 6px; background: none; padding: 0; }
#s3 label.r select, #s3 label.r input[type=text] { width: 100%; background: #241f42; color: #fff; border: 1px solid #3b3463; border-radius: 6px; padding: 5px; font: inherit; grid-column: 2 / 4; }
#s3 label.r.sel { grid-template-columns: 112px 1fr; } #s3 .chips { display: flex; flex-wrap: wrap; gap: 4px; grid-column: 2 / 4; } #s3 .chips button { background: #241f42; color: #ddd6fe; border: 1px solid #3b3463; border-radius: 999px; padding: 4px 9px; cursor: pointer; font: 12px inherit; } #s3 .chips button.on { background: #f472b6; color: #1a0b1f; border-color: #f472b6; }
#s3 .sw { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff3; cursor: pointer; margin: 2px; }
#s3 .gal { position: absolute; inset: 0; background: rgba(10,8,20,.94); z-index: 5; overflow-y: auto; padding: 20px; } #s3 .gal .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; } #s3 .gal .it { background: #1f1a3a; border-radius: 12px; padding: 8px; cursor: pointer; text-align: center; } #s3 .gal img { width: 100%; border-radius: 8px; display: block; margin-bottom: 6px; }
@media (max-width: 900px) { #s3 { grid-template-columns: 170px 1fr 250px; } }

</style>
