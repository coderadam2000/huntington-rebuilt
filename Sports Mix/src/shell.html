<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports Mix</title>
<style><!--@inline style.css--></style>
</head>
<body>
<main>
  <header><h1>Sports Mix</h1><p id="score"></p></header>
  <nav id="sports" aria-label="Choose a sport"></nav>
  <section aria-labelledby="sport">
    <div class="title"><h2 id="sport"></h2><button id="reset">New round</button></div>
    <p id="instructions"></p>
    <canvas id="arena" width="720" height="340" aria-label="Playing field"></canvas>
    <div class="controls"><label>Aim <input id="aim" type="range" min="-100" max="100" value="0"></label><label>Power <input id="power" type="range" min="10" max="100" value="60"></label><button id="play">Play</button></div>
    <p id="feedback" role="status"></p>
  </section>
</main>
<script><!--@inline js/--></script>
</body>
</html>
